/* =========================================================
   PSEUDO-RANDOM ENGINE (deterministic by date + zodiac)
   ========================================================= */
function hashString(str) {
  var hash = 0;
  for (var i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}

/* Mulberry32 — small, fast, deterministic PRNG */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeRng(date, zodiacIndex) {
  var key = date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate() + '|' + zodiacIndex;
  return mulberry32(hashString(key));
}

/* rating in 1.0 - 5.0, step 0.5 */
function randRating(rng) {
  var v = 1 + Math.floor(rng() * 9) * 0.5; /* 1.0,1.5,...,5.0 */
  return Math.min(5, Math.max(1, v));
}

/* pick n unique items from arr, optionally excluding items in `exclude` */
function pickN(rng, arr, n, exclude) {
  var ex = exclude || [];
  var pool = arr.filter(function (x) { return ex.indexOf(x) === -1; });
  var out = [];
  for (var i = 0; i < n && pool.length; i++) {
    var idx = Math.floor(rng() * pool.length);
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

function overallDescFor(rating) {
  if (rating >= 4.5) return OVERALL_DESC.excellent;
  if (rating >= 3.5) return OVERALL_DESC.good;
  if (rating >= 2.5) return OVERALL_DESC.steady;
  if (rating >= 1.5) return OVERALL_DESC.weak;
  return OVERALL_DESC.low;
}

function generateFortune(date, zodiacIndex) {
  var rng = makeRng(date, zodiacIndex);
  var overall = randRating(rng);

  var subs = {};
  SUB_ITEMS.forEach(function (item) { subs[item.key] = randRating(rng); });

  var color = LUCKY_COLORS[Math.floor(rng() * LUCKY_COLORS.length)];
  var number = 1 + Math.floor(rng() * 9);
  var direction = LUCKY_DIRECTIONS[Math.floor(rng() * LUCKY_DIRECTIONS.length)];

  var yiCount = 2 + Math.floor(rng() * 2); /* 2 or 3 */
  var yi = pickN(rng, YI_LIST, yiCount);
  var jiCount = 2 + Math.floor(rng() * 2);
  var ji = pickN(rng, JI_LIST, jiCount, yi); /* avoid contradiction */

  var tarot = TAROT_CARDS[Math.floor(rng() * TAROT_CARDS.length)];
  var maxim = MAXIMS[Math.floor(rng() * MAXIMS.length)];

  return {
    overall: overall,
    subs: subs,
    color: color,
    number: number,
    direction: direction,
    yi: yi,
    ji: ji,
    tarot: tarot,
    maxim: maxim,
    desc: overallDescFor(overall)
  };
}

function starSvg(type) {

  } else if (type === 'half') {

}

function renderStars(rating) {
  rating = Math.max(0, Math.min(5, rating));
  var html = '';
  var full = Math.floor(rating);
  var half = (rating - full) >= 0.5 ? 1 : 0;
  var empty = 5 - full - half;
  var i;
  for (i = 0; i < full; i++) html += starSvg('full');
  for (i = 0; i < half; i++) html += starSvg('half');
  for (i = 0; i < empty; i++) html += starSvg('empty');
  return html;
}

}

function formatDateFull(date) {
  return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + WEEKDAYS[date.getDay()];
}
function formatDateShort(date) {
  return (date.getMonth() + 1) + '月' + date.getDate() + '日';
}

function renderZodiacGrid() {
  var grid = document.getElementById('zodiacGrid');
  var html = '';
  ZODIACS.forEach(function (z, i) {
    html += '<button class="zodiac-btn' + (i === state.zodiacIndex ? ' active' : '') + '" data-idx="' + i + '">' +
              '<span class="z-symbol">' + z.symbol + '</span>' +
              '<span class="z-name">' + z.name + '</span>' +
              '<span class="z-date">' + z.date + '</span>' +
            '</button>';
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.zodiac-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.zodiacIndex = parseInt(btn.getAttribute('data-idx'), 10);
      try { localStorage.setItem('uponstar-zodiac', state.zodiacIndex); } catch (e) {}
      renderZodiacGrid();
      render();
    });
  });
}

function renderDateSwitcher() {
  var sw = document.getElementById('dateSwitcher');
  var labels = ['今天', '明天', '后天'];
  var html = '';
  for (var i = 0; i < 3; i++) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + i);
    html += '<button class="date-btn' + (i === state.dateOffset ? ' active' : '') + '" data-offset="' + i + '">' +
              '<span class="d-label">' + labels[i] + '</span>' +
              '<span class="d-date">' + formatDateShort(d) + '</span>' +
            '</button>';
  }
  sw.innerHTML = html;
  sw.querySelectorAll('.date-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.dateOffset = parseInt(btn.getAttribute('data-offset'), 10);
      renderDateSwitcher();
      render();
    });
  });
}

function render() {
  var date = getSelectedDate();
  var z = ZODIACS[state.zodiacIndex];
  var f = generateFortune(date, state.zodiacIndex);

  /* Header meta */
  document.getElementById('headerDate').textContent = formatDateFull(date);
  document.getElementById('headerZodiac').textContent = z.name + ' ' + z.symbol;

  /* Overall card */
  document.getElementById('overallWatermark').textContent = z.symbol;
  document.getElementById('overallZodiacLine').innerHTML = z.name + ' <span class="o-symbol">' + z.symbol + '</span> ' + z.en;
  document.getElementById('overallDate').textContent = formatDateFull(date);
  document.getElementById('overallStars').innerHTML = renderStars(f.overall);
  document.getElementById('overallNum').textContent = f.overall.toFixed(1);
  document.getElementById('overallDesc').textContent = f.desc;

  /* Sub grid */
  var subHtml = '';
  SUB_ITEMS.forEach(function (item) {
    var r = f.subs[item.key];
    subHtml += '<div class="sub-item">' +
                 '<div class="sub-icon">' + item.icon + '</div>' +
                 '<div class="sub-name">' + item.name + '</div>' +
                 '<div class="sub-stars">' + renderStars(r) + '</div>' +
                 '<div class="sub-num">' + r.toFixed(1) + '</div>' +
               '</div>';
  });
  document.getElementById('subGrid').innerHTML = subHtml;

  /* Lucky trio */
  document.getElementById('luckyGrid').innerHTML =
    '<div class="lucky-item"><span class="lucky-label">幸运色</span>' +
      '<span class="lucky-value">' + f.color.name +
        '<span class="color-swatch" style="background:' + f.color.hex + ';"></span>' +
      '</span></div>' +
    '<div class="lucky-item"><span class="lucky-label">幸运数字</span>' +
      '<span class="lucky-value">' + f.number + '</span></div>' +
    '<div class="lucky-item"><span class="lucky-label">幸运方位</span>' +
      '<span class="lucky-value">' + f.direction + '</span></div>';

  /* Yi / Ji */
  var yiHtml = f.yi.map(function (t) {
    return '<div class="yiji-tag"><span class="tag-mark">✦</span><span>' + t + '</span></div>';
  }).join('');
  var jiHtml = f.ji.map(function (t) {
    return '<div class="yiji-tag"><span class="tag-mark">✕</span><span>' + t + '</span></div>';
  }).join('');
  document.getElementById('yiItems').innerHTML = yiHtml;
  document.getElementById('jiItems').innerHTML = jiHtml;

  /* Tarot */
  document.getElementById('tarotRoman').textContent = f.tarot.roman;
  document.getElementById('tarotIllustration').textContent = f.tarot.sym;
  document.getElementById('tarotNameCn').textContent = f.tarot.cn;
  document.getElementById('tarotNameEn').textContent = f.tarot.en;
  document.getElementById('tarotMeaning').textContent = f.tarot.meaning;

  /* Maxim */
  document.getElementById('maximText').textContent = f.maxim;

  /* Re-trigger reveal animation */
  var el = document.getElementById('fortuneResult');
  el.classList.remove('reveal');
  void el.offsetWidth;
  el.classList.add('reveal');

  /* 初始化分享组件 */
  initDailyShare(z, date, f);
}

// ===== 分享组件初始化 =====
function initDailyShare(z, date, f) {
  if (typeof ShareWidget === 'undefined') return;

  var dateStr = formatDateFull(date);
  var stars = function (r) {
    var s = '';
    var full = Math.floor(r);
    var half = (r - full) >= 0.5 ? 1 : 0;
    for (var i = 0; i < full; i++) s += '★';
    if (half) s += '☆';
    return s;
  };

  var summary = '星座：' + z.name + ' ' + z.symbol + '\n';
  summary += '日期：' + dateStr + '\n';
  summary += '综合运势：' + f.overall.toFixed(1) + ' ' + stars(f.overall) + '\n\n';
  summary += '各分项评分：\n';
  SUB_ITEMS.forEach(function (item) {
    var r = f.subs[item.key];
    summary += '  ' + item.icon + ' ' + item.name + '：' + r.toFixed(1) + ' ' + stars(r) + '\n';
  });
  summary += '\n幸运色：' + f.color.name + ' · 幸运数字：' + f.number + ' · 幸运方位：' + f.direction;

  ShareWidget.init({
    title: z.name + ' · 每日运势',
    type: 'daily',
    summary: summary,
    data: {
      zodiac: z.name,
      date: dateStr,
      overall: f.overall,
      subs: f.subs,
      luckyColor: f.color.name,
      luckyNumber: f.number,
      luckyDirection: f.direction
    }
  });
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  /* restore saved zodiac */
  try {
    var saved = localStorage.getItem('uponstar-zodiac');
    if (saved !== null) {
      var idx = parseInt(saved, 10);
      if (!isNaN(idx) && idx >= 0 && idx < ZODIACS.length) state.zodiacIndex = idx;
    }
  } catch (e) {}

  renderZodiacGrid();
  renderDateSwitcher();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
