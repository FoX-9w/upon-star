<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 · Upon Star</title>
<style>
@font-face { font-family: 'CrimsonPro'; src: url('./_shared/fonts/CrimsonPro-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'CrimsonPro'; src: url('./_shared/fonts/CrimsonPro-Bold.ttf') format('truetype'); font-weight: 700; }
@font-face { font-family: 'Outfit'; src: url('./_shared/fonts/Outfit-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'Outfit'; src: url('./_shared/fonts/Outfit-Bold.ttf') format('truetype'); font-weight: 700; }
@font-face { font-family: 'Italiana'; src: url('./_shared/fonts/Italiana-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'PoiretOne'; src: url('./_shared/fonts/PoiretOne-Regular.ttf') format('truetype'); font-weight: 400; }

:root {
  --bg: #040408; --bg2: #08080e; --surface: #0c0c14;
  --ink: #f0ece4; --ink-dim: #a09888; --muted: #605850;
  --rule: rgba(200,164,92,0.12); --rule-bright: rgba(200,164,92,0.25);
  --gold: #c8a45c; --gold-light: #e0c078; --gold-dim: #8a7040;
  --radius: 6px; --radius-card: 10px;
  --font-serif: 'CrimsonPro', Georgia, 'Songti SC', serif;
  --font-sans: 'Outfit', 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;
  --font-display: 'Italiana', 'CrimsonPro', Georgia, serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.8 var(--font-sans); -webkit-font-smoothing: antialiased;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

.sacred-light {
  position: fixed; top: -30%; left: 50%; transform: translateX(-50%);
  width: 1400px; height: 900px;
  background: radial-gradient(ellipse at center, rgba(200,164,92,0.06) 0%, transparent 65%);
  pointer-events: none; z-index: 1;
}
.stars-bg {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(1px 1px at 20% 30%, rgba(200,164,92,0.3) 50%, transparent 50%),
    radial-gradient(1px 1px at 60% 20%, rgba(200,164,92,0.2) 50%, transparent 50%),
    radial-gradient(1px 1px at 40% 70%, rgba(200,164,92,0.25) 50%, transparent 50%),
    radial-gradient(1px 1px at 80% 50%, rgba(200,164,92,0.15) 50%, transparent 50%),
    radial-gradient(1px 1px at 10% 60%, rgba(200,164,92,0.2) 50%, transparent 50%),
    radial-gradient(2px 2px at 70% 80%, rgba(200,164,92,0.15) 50%, transparent 50%),
    radial-gradient(1px 1px at 30% 85%, rgba(200,164,92,0.2) 50%, transparent 50%);
}

.wrap {
  position: relative; z-index: 2;
  text-align: center; padding: 48px 24px;
  max-width: 520px;
}
.constellation {
  margin-bottom: 32px;
  opacity: 0.4;
}
.constellation svg {
  width: 100px; height: 100px;
}
.err-code {
  font: 400 120px/1 var(--font-display);
  background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-dim) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  opacity: 0.9;
}
.err-label {
  font: 400 11px var(--font-sans);
  color: var(--gold);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 24px;
}
h1 {
  font: 400 24px/1.3 var(--font-display);
  letter-spacing: 2px;
  margin-bottom: 16px;
}
p {
  color: var(--ink-dim);
  font: 400 14px/1.8 var(--font-sans);
  margin-bottom: 32px;
}
.gold-line {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
  margin: 24px auto; opacity: 0.5;
}
.links {
  display: flex; flex-wrap: wrap; gap: 12px;
  justify-content: center;
}
.links a {
  display: inline-block;
  padding: 12px 28px;
  border-radius: 999px;
  border: 1px solid var(--gold-dim);
  color: var(--gold-light);
  font: 500 13px var(--font-sans);
  letter-spacing: 1.5px;
  text-decoration: none;
  transition: all 0.3s;
}
.links a:hover {
  background: rgba(200,164,92,0.08);
  box-shadow: 0 0 24px rgba(200,164,92,0.1);
  transform: translateY(-1px);
}
.links a.primary {
  border-color: var(--gold);
  background: rgba(200,164,92,0.06);
}
@media (max-width: 600px) {
  .err-code { font-size: 80px; }
  h1 { font-size: 20px; }
  p { font-size: 13px; }
  .links a { padding: 10px 20px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="sacred-light"></div>
<div class="stars-bg"></div>

<div class="wrap">
  <div class="constellation">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="25" r="2" fill="#c8a45c"/>
      <circle cx="50" cy="15" r="2.5" fill="#e0c078"/>
      <circle cx="80" cy="30" r="2" fill="#c8a45c"/>
      <circle cx="35" cy="55" r="2" fill="#c8a45c"/>
      <circle cx="65" cy="50" r="2" fill="#c8a45c"/>
      <circle cx="20" cy="75" r="1.5" fill="#c8a45c"/>
      <circle cx="50" cy="80" r="2" fill="#e0c078"/>
      <circle cx="80" cy="70" r="1.5" fill="#c8a45c"/>
      <line x1="20" y1="25" x2="50" y2="15" stroke="#c8a45c" stroke-width="0.5" opacity="0.4"/>
      <line x1="50" y1="15" x2="80" y2="30" stroke="#c8a45c" stroke-width="0.5" opacity="0.4"/>
      <line x1="20" y1="25" x2="35" y2="55" stroke="#c8a45c" stroke-width="0.5" opacity="0.3"/>
      <line x1="50" y1="15" x2="65" y2="50" stroke="#c8a45c" stroke-width="0.5" opacity="0.3"/>
      <line x1="80" y1="30" x2="65" y2="50" stroke="#c8a45c" stroke-width="0.5" opacity="0.3"/>
      <line x1="35" y1="55" x2="20" y2="75" stroke="#c8a45c" stroke-width="0.5" opacity="0.3"/>
      <line x1="35" y1="55" x2="50" y2="80" stroke="#c8a45c" stroke-width="0.5" opacity="0.3"/>
      <line x1="65" y1="50" x2="50" y2="80" stroke="#c8a45c" stroke-width="0.5" opacity="0.3"/>
      <line x1="65" y1="50" x2="80" y2="70" stroke="#c8a45c" stroke-width="0.5" opacity="0.3"/>
    </svg>
  </div>

  <div class="err-code">404</div>
  <div class="err-label">Page Not Found</div>
  <h1>星辰迷途</h1>
  <p>你寻找的页面似乎已隐入星海，或被命运的风吹到了别处。</p>
  <div class="gold-line"></div>
  <div class="links">
    <a href="./divination-homepage.html" class="primary">返回首页</a>
    <a href="./tarot.html">塔罗占卜</a>
    <a href="./liuyao.html">六爻起卦</a>
  </div>
</div>

</body>
</html>
