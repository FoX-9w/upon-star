  <style>
  /* ============================================================
     intro.html —— 启幕门厅 v2（极简版）
     整页只做一件事：黑暗里，星离位 → 沿轨道公转一周 → 归位爆闪。
     落定后唯一浮现的入口：一枚「探索」。点它（或点页面任意处）进英雄页。
     · 公转动效复用 assets/logo-orbit.css + .js，本页放慢节奏
     · 英雄页 = divination-homepage.html（首屏 hero + 往下滑动六幕，结构不变）
     ============================================================ */

  /* ---------- 电影感节奏：本页覆盖模块默认节拍 ----------
     2026-10-09e：t0 .90→.18（去掉落定死停）、公转改匀速+微呼吸（logo-orbit.js），
     dive 1.35 + t0 .18 + hook .45×2 + dur 6.20 = end 8.63，自洽 */
  :root{
    --lo-dive: 1.35s;
    --lo-t0:   .18s;
    --lo-hook: .45s;
    --lo-dur:  6.20s;
    --lo-end:  8.63s;
    --lo-rest: 9.40s;
  }

  html,body{height:100%;}
  body{margin:0;background:var(--bg);overflow:hidden;}

  .in-scene{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:clamp(20px,3.4vh,40px);
    padding:clamp(18px,3vh,40px);cursor:pointer;}
  /* 极淡的四角晕，把视线收进中央 */
  .in-scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    box-shadow:inset 0 0 26vmin rgba(0,0,0,.72);}
  /* 深蓝夜幕：顶部一泓深蓝渐隐，呼应启幕视频的深海蓝光 */
  .in-scene::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 62% at 50% -14%, rgba(38,72,138,.34), rgba(20,40,86,.14) 46%, transparent 72%),
      radial-gradient(60% 34% at 50% -6%, rgba(120,170,235,.12), transparent 70%);}

  /* ---------- 星尘画布：logo 层后方，整片流光粒子场 ---------- */
  #inDust{position:fixed;inset:0;z-index:1;pointer-events:none;display:block;}

  /* 顶部天光：两道极淡光柱缓慢摆动（视频里的 god rays） */
  .in-rays{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.5;}
  .in-rays i{position:absolute;top:-12%;width:16vmin;height:70vh;
    background:linear-gradient(180deg, rgba(190,215,255,.10), rgba(160,190,240,.035) 42%, transparent 78%);
    transform:skewX(-8deg);filter:blur(6px);}
  .in-rays i:nth-child(1){left:24%;animation:inRay 11s ease-in-out infinite alternate;}
  .in-rays i:nth-child(2){left:52%;width:9vmin;animation:inRay 14s ease-in-out -5s infinite alternate-reverse;}
  .in-rays i:nth-child(3){left:68%;width:5vmin;animation:inRay 17s ease-in-out -9s infinite alternate;}
  @keyframes inRay{from{transform:skewX(-8deg) translateX(-3vmin);opacity:.55;}
                   to{transform:skewX(-11deg) translateX(4vmin);opacity:.95;}}

  /* ---------- 舞台：整页唯一主体（自适应放大，吃满视口）----------
     2026-10-09d：94vh→108vh（画布高 0.8545×宽 → 舞台高 ≈92vh），
     「探索」按钮改为绝对定位坐进拱门正中（门轴已居中，left:50% 即柱间） */
  .in-stage{position:relative;z-index:2;width:min(1900px,97vw,108vh);}

  /* ---------- 唯一入口：归位爆闪后浮现（绝对定位，坐在拱门柱间） ---------- */
  .in-enter{position:absolute;left:50%;bottom:clamp(44px,7.5vh,90px);z-index:3;
    transform:translateX(-50%);
    display:inline-flex;flex-direction:column;align-items:center;gap:4px;
    padding:14px 52px;border-radius:999px;
    border:1px solid var(--gold);background:transparent;color:var(--gold-light);
    transition:background .25s,box-shadow .3s,color .25s;}
  .in-enter:hover{background:var(--gold);color:var(--on-accent);
    box-shadow:0 0 34px rgba(200,164,92,.5);}
  .in-enter-cn{font-family:var(--font-sans);font-size:1.02rem;letter-spacing:.34em;line-height:1.3;}
  .in-enter-en{font-family:var(--font-decor);font-size:.56rem;letter-spacing:.3em;
    text-transform:uppercase;opacity:.66;line-height:1.2;}

  /* 入场门控：html.in-armed 时先藏入口；in-show 挂上后按 --lo-rest 延迟浮现。
     JS 失效 → 无 in-armed → 入口直接可见（静止终态），不白屏。
     兜底规则放在 in-show 之前：两规则同特异性，后声明的 in-show 优先 */
  html.in-armed .in-enter{animation:inReveal 1.5s ease 12s forwards;}
  html.in-armed .in-enter{opacity:0;}
  html.in-armed.in-show .in-enter{animation:inReveal 1.5s cubic-bezier(.22,.61,.36,1) var(--lo-rest) both;}
  html.in-armed.in-show .in-stage{animation:inStageIn 1.2s ease both;}
  @keyframes inReveal{from{opacity:0;transform:translateX(-50%) translateY(12px);}
                      to{opacity:1;transform:translateX(-50%);}}
  @keyframes inStageIn{from{opacity:0;}to{opacity:1;}}

  /* 合规要求的常驻声明：极淡，不抢画面 */
  .in-legal{position:absolute;bottom:clamp(10px,1.8vh,18px);left:0;right:0;z-index:2;
    text-align:center;font-family:var(--font-sans);font-size:.62rem;
    letter-spacing:.1em;color:var(--text-dim);opacity:.42;padding:0 16px;}

  /* ---------- 丝带飘动：波动副本的湍流位移 + 羽化遮罩 ----------
     遮罩只开丝带区（x≈24%–72%，y≈30%–100%，羽化边），
     立柱（17–24% / 76–83%）与拱肩不受扰动；滤镜不支持时副本无位移=静止 */
  .lo-mark-wave{
    filter:url(#ribbonWave);
    -webkit-mask-image:linear-gradient(90deg,transparent 24%,#000 31%,#000 64%,transparent 72%),
                       linear-gradient(180deg,transparent 26%,#000 37%,#000 93%,transparent 99%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(90deg,transparent 24%,#000 31%,#000 64%,transparent 72%),
               linear-gradient(180deg,transparent 26%,#000 37%,#000 93%,transparent 99%);
    mask-composite:intersect;
  }

  /* ---------- 全视之眼：仿人眨眼 ----------
     5.6s 一次快眨：上睑先行、下睑滞后约 30ms（真人眼睑时差），
     合拢 ≈140ms → 短驻 ≈90ms → 睁开 ≈130ms；闭合即空眼窝，合缝一道金线 */
  .lo-lids{position:absolute;inset:0;width:100%;height:100%;z-index:1;
    margin-left:-14.5%;pointer-events:none;overflow:visible;}
  .lo-lid{transform-box:fill-box;}
  .lo-lid-top{transform-origin:50% 0%;animation:loLidTop 5.6s ease-in-out infinite;}
  .lo-lid-bot{transform-origin:50% 100%;animation:loLidBot 5.6s ease-in-out infinite;}
  @keyframes loLidTop{0%,91%{transform:scaleY(0);}
                      93.5%,94.6%{transform:scaleY(1);}
                      96.8%,100%{transform:scaleY(0);}}
  @keyframes loLidBot{0%,91.6%{transform:scaleY(0);}
                      94.1%,95.2%{transform:scaleY(1);}
                      97.4%,100%{transform:scaleY(0);}}
  .lo-lash{opacity:0;animation:loLash 5.6s ease-in-out infinite;}
  @keyframes loLash{0%,92.4%{opacity:0;}
                    93.4%,95%{opacity:.5;}
                    96.6%,100%{opacity:0;}}

  /* 流星尾迹：仅在俯冲相位可见（时长读 --lo-dive，与 JS 同源）。
     俯冲起点 = 页面左上角 (0,0)（logo-orbit.js computeDive 反算），
     尾迹角度 = 起点→落点的屏幕方位角，由 JS 写入 --lo-tail-ang，任何视口都指向来路。
     2026-10-09f：撤公转彗尾（过于浮夸），俯冲尾翼退回克制版 430% */
  .lo-tail{position:absolute;right:50%;top:50%;width:430%;height:16%;
    z-index:0;transform-origin:right center;border-radius:999px;pointer-events:none;
    background:linear-gradient(to left, rgba(222,238,255,.95), rgba(165,205,255,.38) 46%, transparent 82%);
    filter:blur(1.5px);opacity:0;}
  html.lo-play .lo-tail{animation:loDiveTail var(--lo-dive) cubic-bezier(.2,.75,.45,1) both;}
  @keyframes loDiveTail{
    0%{opacity:1;transform:translateY(-50%) rotate(var(--lo-tail-ang,45deg)) scaleX(1);}
    70%{opacity:.8;}
    100%{opacity:0;transform:translateY(-50%) rotate(var(--lo-tail-ang,45deg)) scaleX(.12);}}

  @media (max-width:640px){
    .in-stage{width:min(100vw - 12px,108vh);}
    .in-enter{padding:12px 42px;bottom:clamp(38px,6vh,72px);}
  }

  @media (prefers-reduced-motion:reduce){
    html.in-armed .in-enter{opacity:1;animation:none;}
    html.in-armed.in-show .in-enter,html.in-armed.in-show .in-stage{animation:none;}
    .in-rays{display:none;}
    #inDust{display:none;}
    .lo-lids{display:none;}
    .lo-mark-wave{display:none;}
    .lo-tail{display:none;}
  }
  </style>

  <script>
  /* ============================================================
     星尘粒子场 v2（只服务 intro 门厅；logo 与公转动效零改动）
     视觉取自启幕参考视频：黑底 + 深蓝夜幕 + 上浮星尘 + 流光丝带
     + 极光纱幕 + 远景闪烁星 + 偶发流星（呼应 Wish upon a Star）。
     分层：星点(静) / 纱幕(柔) / 星尘(浮) / 流光丝(动) / 流星(稀)
     约束：单画布 · DPR≤2 · 页签隐藏即暂停 · reduced-motion 不启动
     ============================================================ */
  (function () {
    'use strict';
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.getElementById('inDust');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, DPR = 1;

    var dust = [];        // 上浮星尘
    var stars = [];       // 远景闪烁星（不移动，只呼吸）
    var streams = [];     // 流光丝带粒子（带渐隐尾迹）
    var veils = [];       // 极光纱幕（大柔光斑漂移）
    var meteors = [];     // 流星群（可多发并行）
    var meteorCool = 1.2;
    var pending = [];     // 延迟生成的伴飞流星 {t, big}
    /* 北斗七星：固定构形 + 呼吸闪烁（勺形，柄朝左下；天枢 Dubhe 为橙巨星取暖金） */
    var DIP = [
      { x: 0.00, y: 0.98, hue: '186,214,255' },   // 摇光 Alkaid
      { x: 0.20, y: 0.72, hue: '186,214,255' },   // 开阳 Mizar
      { x: 0.42, y: 0.55, hue: '210,228,255' },   // 玉衡 Alioth
      { x: 0.62, y: 0.42, hue: '186,214,255' },   // 天权 Megrez
      { x: 0.68, y: 0.88, hue: '150,196,255' },   // 天玑 Phecda
      { x: 1.00, y: 0.80, hue: '150,196,255' },   // 天璇 Merak
      { x: 1.06, y: 0.30, hue: '224,180,110' }    // 天枢 Dubhe（暖金）
    ];
    var dipper = [], dipBox = null;
    /* 十二星座：简化构形散布两侧天区（s=构形框宽占视口比），第 i 座相位差 π/6 → 交替呼吸 */
    var ZOD = [
      { x: .045, y: .285, s: .085, p: [[.05, .35], [.4, .5], [.72, .42], [.95, .75]] },              // 白羊
      { x: .125, y: .075, s: .105, p: [[.08, .3], [.32, .52], [.5, .64], [.68, .5], [.92, .18]] },   // 金牛
      { x: .845, y: .06,  s: .105, p: [[.15, .15], [.25, .5], [.3, .9], [.75, .1], [.7, .5], [.65, .88]] }, // 双子
      { x: .93,  y: .265, s: .08,  p: [[.5, .1], [.45, .5], [.15, .85], [.85, .85]] },               // 巨蟹
      { x: .03,  y: .585, s: .1,   p: [[.9, .35], [.7, .2], [.5, .15], [.35, .3], [.4, .55], [.1, .75]] }, // 狮子
      { x: .945, y: .52,  s: .09,  p: [[.1, .3], [.4, .5], [.7, .3], [.85, .7], [.45, .85]] },       // 室女
      { x: .045, y: .84,  s: .085, p: [[.15, .35], [.85, .35], [.5, .85]] },                         // 天秤
      { x: .9,   y: .8,   s: .095, p: [[.05, .2], [.3, .35], [.5, .55], [.55, .8], [.78, .9], [.97, .68]] }, // 天蝎
      { x: .315, y: .055, s: .095, p: [[.1, .6], [.35, .45], [.6, .5], [.82, .3], [.55, .88], [.85, .78]] }, // 人马
      { x: .635, y: .045, s: .085, p: [[.1, .8], [.45, .2], [.8, .5], [.92, .85]] },                 // 摩羯
      { x: .795, y: .385, s: .09,  p: [[.05, .35], [.3, .5], [.55, .35], [.75, .6], [.95, .45]] },   // 宝瓶
      { x: .165, y: .43,  s: .09,  p: [[.05, .8], [.35, .6], [.6, .45], [.88, .2], [.92, .58], [.62, .86]] } // 双鱼
    ];
    var zods = [];
    // logo 俯冲同步：画布 1 大 2 小流星伴飞
    window.addEventListener('logoorbit:dive', function () {
      pending.push({ t: 0, big: 1 }, { t: .3 }, { t: .7 });
    });

    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    var COOL = ['186,214,255', '150,196,255', '210,228,255', '128,178,255'];
    var WARM = '224,180,110';   // 品牌金，少数点缀

    /* ---------- 生成器 ---------- */
    function makeDust(seedY) {
      var gold = Math.random() < 0.16;
      return {
        x: rand(0, 1), y: seedY ? rand(0, 1) : 1.06,
        r: rand(0.6, 2.2),
        vy: rand(0.012, 0.038),
        sway: rand(0.4, 1.6), swayPh: rand(0, Math.PI * 2), swaySp: rand(0.12, 0.45),
        a: rand(0.16, 0.6),
        hue: gold ? WARM : pick(COOL)
      };
    }
    function makeStar() {
      return {
        x: rand(0, 1), y: rand(-0.02, 0.58),   // 上移：天空区更满（下半留给星尘/丝带）
        r: rand(0.4, 1.1),
        ph: rand(0, Math.PI * 2), sp: rand(0.5, 1.6),
        a: rand(0.12, 0.5),
        hue: Math.random() < 0.12 ? WARM : pick(COOL)
      };
    }
    /* 流光丝：沿正弦路径下滑的发光丝，尾迹 = 轨迹历史渐隐 */
    function makeStream() {
      var hue = Math.random() < 0.14 ? WARM : pick(COOL);
      return {
        x: rand(0.06, 0.94), y: rand(-0.08, 0.5),
        vx: rand(0.014, 0.05) * (Math.random() < 0.5 ? -1 : 1),
        vy: rand(0.05, 0.14),
        amp: rand(0.012, 0.05),           // 弯曲幅度
        freq: rand(1.2, 3.2), ph: rand(0, Math.PI * 2),
        life: 0, ttl: rand(6, 12),
        w: rand(0.8, 2.0),                 // 线宽
        hue: hue, hist: []
      };
    }
    function makeVeil() {
      return {
        x: rand(0.1, 0.9), y: rand(0.02, 0.3),
        rx: rand(0.28, 0.55), ry: rand(0.10, 0.22),
        vx: rand(0.004, 0.012) * (Math.random() < 0.5 ? -1 : 1),
        a: rand(0.05, 0.12),
        hue: pick(['90,140,220', '120,170,240', '80,120,200'])
      };
    }
    /* 普通流星：天顶随机入场，斜向滑落（大小/速度/尾长随机） */
    function spawnMeteor() {
      meteors.push({
        x: rand(0.02, 0.96), y: rand(-0.06, 0.30),
        vx: rand(0.08, 0.26) * (Math.random() < 0.5 ? -1 : 1),
        vy: rand(0.30, 0.58), life: 0, ttl: rand(0.8, 1.5),
        w: rand(1.1, 2.0), tail: rand(0.10, 0.20)
      });
    }

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      var area = W * H;
      var nDust = Math.max(80, Math.min(170, Math.round(area / 12000)));
      var nStar = Math.max(64, Math.min(130, Math.round(area / 13000)));
      var nStream = Math.max(16, Math.min(34, Math.round(area / 55000)));
      if (dust.length > nDust) dust.length = nDust;
      while (dust.length < nDust) dust.push(makeDust(true));
      if (stars.length > nStar) stars.length = nStar;
      while (stars.length < nStar) stars.push(makeStar());
      if (streams.length > nStream) streams.length = nStream;
      while (streams.length < nStream) streams.push(makeStream());
      if (!veils.length) { veils.push(makeVeil(), makeVeil()); }

      /* 北斗：构形框钉在左上天区（避开拱门主体），resize 重排 */
      if (!dipper.length) {
        for (var di = 0; di < DIP.length; di++) {
          dipper.push({
            r: rand(1.7, 2.6), ph: rand(0, Math.PI * 2),
            sp: rand(0.35, 0.75), a: rand(0.5, 0.85)
          });
        }
      }
      var bw = Math.max(120, Math.min(0.22 * W, 340));
      dipBox = { x: Math.max(14, 0.035 * W), y: 0.10 * H, w: bw, h: bw * 0.64 };

      /* 十二星座：每座一套星点参数，相位 = 序号×π/6（交替呼吸），resize 只排位置 */
      if (!zods.length) {
        for (var zi = 0; zi < ZOD.length; zi++) {
          var grp = [];
          for (var pi = 0; pi < ZOD[zi].p.length; pi++) {
            grp.push({
              r: rand(0.9, 1.55), a: rand(0.3, 0.58),
              sp: rand(0.4, 0.9), ph: zi * Math.PI / 6 + rand(-0.15, 0.15),
              hue: (zi === 1 || zi === 7) && pi === 0 ? WARM : pick(COOL)
            });
          }
          zods.push(grp);
        }
      }
    }

    function drawGlow(x, y, r, hue, a) {
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(' + hue + ',' + a.toFixed(3) + ')');
      g.addColorStop(0.4, 'rgba(' + hue + ',' + (a * 0.35).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(' + hue + ',0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }

    var last = 0;
    function frame(ts) {
      if (document.hidden) { last = ts; requestAnimationFrame(frame); return; }
      var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
      var t = ts / 1000;
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      /* 远景闪烁星：不动，只呼吸 */
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = s.a * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
        drawGlow(s.x * W, s.y * H, s.r * 3.2, s.hue, a);
      }

      /* 北斗七星：慢呼吸 + 细碎闪，构形连线程控在极低透明度 */
      if (dipBox) {
        var pts = [];
        for (var di = 0; di < DIP.length; di++) {
          var d7 = dipper[di], d0 = DIP[di];
          var dxp = dipBox.x + d0.x * dipBox.w, dyp = dipBox.y + d0.y * dipBox.h;
          var br = 0.5 + 0.5 * Math.sin(t * d7.sp + d7.ph);          // 慢呼吸
          var shimmer = 0.9 + 0.1 * Math.sin(t * 2.6 + d7.ph * 2);   // 细碎闪
          var da = d7.a * (0.38 + 0.62 * br) * shimmer;
          drawGlow(dxp, dyp, d7.r * 4.4, d0.hue, da);
          drawGlow(dxp, dyp, d7.r * 1.5, d0.hue, Math.min(1, da * 1.9));
          pts.push({ x: dxp, y: dyp, b: br });
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = 'rgba(170,205,250,0.10)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var li = 0; li < pts.length; li++) {
          if (li === 0) ctx.moveTo(pts[li].x, pts[li].y);
          else ctx.lineTo(pts[li].x, pts[li].y);
        }
        ctx.lineTo(pts[3].x, pts[3].y);   // 天枢→天权 合勺口
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
      }

      /* 十二星座：散布两侧天区，相位轮转交替呼吸；连线极淡只助辨形 */
      if (zods.length) {
        for (var zg = 0; zg < ZOD.length; zg++) {
          var box = ZOD[zg];
          var zw = Math.max(70, Math.min(box.s * W, 150)), zh = zw * 0.7;
          var gpts = [];
          for (var zi2 = 0; zi2 < box.p.length; zi2++) {
            var gz = zods[zg][zi2], gp = box.p[zi2];
            var zxp = box.x * W + gp[0] * zw, zyp = box.y * H + gp[1] * zh;
            var gbr = 0.5 + 0.5 * Math.sin(t * gz.sp + gz.ph);
            drawGlow(zxp, zyp, gz.r * 3.4, gz.hue, gz.a * (0.35 + 0.65 * gbr));
            gpts.push({ x: zxp, y: zyp });
          }
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = 'rgba(170,205,250,0.06)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (var li2 = 0; li2 < gpts.length; li2++) {
            if (li2 === 0) ctx.moveTo(gpts[li2].x, gpts[li2].y);
            else ctx.lineTo(gpts[li2].x, gpts[li2].y);
          }
          ctx.stroke();
          ctx.globalCompositeOperation = 'lighter';
        }
      }

      /* 极光纱幕：大柔光斑横向漂移，顶部为主 */
      for (var v = 0; v < veils.length; v++) {
        var ve = veils[v];
        ve.x += ve.vx * dt;
        if (ve.x < -0.7) ve.x = 1.7; if (ve.x > 1.7) ve.x = -0.7;
        var vx = ve.x * W, vy = ve.y * H;
        var vg = ctx.createRadialGradient(vx, vy, 0, vx, vy, ve.rx * W);
        vg.addColorStop(0, 'rgba(' + ve.hue + ',' + ve.a.toFixed(3) + ')');
        vg.addColorStop(0.55, 'rgba(' + ve.hue + ',' + (ve.a * 0.3).toFixed(3) + ')');
        vg.addColorStop(1, 'rgba(' + ve.hue + ',0)');
        ctx.save();
        ctx.translate(vx, vy); ctx.scale(1, ve.ry / ve.rx);
        ctx.translate(-vx, -vy);
        ctx.fillStyle = vg;
        ctx.beginPath(); ctx.arc(vx, vy, ve.rx * W, 0, 6.2832); ctx.fill();
        ctx.restore();
      }

      /* 上浮星尘 */
      for (var d = 0; d < dust.length; d++) {
        var p = dust[d];
        p.y -= p.vy * dt;
        var x = (p.x + Math.sin(t * p.swaySp + p.swayPh) * 0.004 * p.sway) * W;
        var y = p.y * H;
        if (y < -12) { dust[d] = makeDust(false); continue; }
        var a = p.a * (0.72 + 0.28 * Math.sin(t * 1.7 + p.swayPh * 3));
        drawGlow(x, y, p.r * 4, p.hue, a);
      }

      /* 流光丝带：下滑 + 正弦横摆，尾迹历史点渐隐 */
      for (var q = 0; q < streams.length; q++) {
        var st = streams[q];
        st.life += dt;
        if (st.life >= st.ttl || st.y > 1.15) { streams[q] = makeStream(); continue; }
        var nx = st.x + st.vx * dt + Math.sin(t * st.freq + st.ph) * st.amp * dt * 6;
        var ny = st.y + st.vy * dt;
        st.x = nx; st.y = ny;
        st.hist.push({ x: nx * W, y: ny * H });
        if (st.hist.length > 26) st.hist.shift();
        var k = st.life / st.ttl;
        var fade = Math.sin(Math.PI * Math.min(1, k * 1.15));   // 淡入→淡出
        if (st.hist.length > 2) {
          // 分段渐隐折线：越靠尾部越淡越细
          for (var seg = 1; seg < st.hist.length; seg++) {
            var h0 = st.hist[seg - 1], h1 = st.hist[seg];
            var f = (seg / st.hist.length) * fade;
            ctx.strokeStyle = 'rgba(' + st.hue + ',' + (0.5 * f).toFixed(3) + ')';
            ctx.lineWidth = st.w * f + 0.2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(h0.x, h0.y); ctx.lineTo(h1.x, h1.y); ctx.stroke();
          }
        }
        var hx = st.hist[st.hist.length - 1];
        drawGlow(hx.x, hx.y, st.w * 4.5, st.hue, 0.55 * fade);
      }

      /* 流星群：logo 俯冲时 1 大 2 小伴飞；平时冷却更短、常 1~2 发并行 */
      for (var pi = pending.length - 1; pi >= 0; pi--) {
        pending[pi].t -= dt;
        if (pending[pi].t <= 0) {
          if (pending[pi].big) {
            meteors.push({ x: -0.05, y: -0.04, vx: 0.36, vy: 0.52, life: 0, ttl: 1.3, w: 2.6, tail: 0.24 });
          } else {
            spawnMeteor();
          }
          pending.splice(pi, 1);
        }
      }
      meteorCool -= dt;
      if (meteorCool <= 0) {
        spawnMeteor();
        if (Math.random() < 0.4) spawnMeteor();
        meteorCool = rand(0.9, 2.4);
      }
      for (var m = meteors.length - 1; m >= 0; m--) {
        var st = meteors[m];
        st.life += dt;
        st.x += st.vx * dt; st.y += st.vy * dt;
        var sk = st.life / st.ttl;
        if (sk >= 1 || st.y > 0.95) { meteors.splice(m, 1); continue; }
        var sx = st.x * W, sy = st.y * H;
        var sp = Math.hypot(st.vx, st.vy);
        var tail = st.tail * W;
        var ex = sx - st.vx / sp * tail, ey = sy - st.vy / sp * tail;
        var sf = Math.sin(Math.PI * sk);
        var lg = ctx.createLinearGradient(sx, sy, ex, ey);
        lg.addColorStop(0, 'rgba(214,236,255,' + (0.9 * sf).toFixed(3) + ')');
        lg.addColorStop(1, 'rgba(150,196,255,0)');
        ctx.strokeStyle = lg; ctx.lineWidth = st.w; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
        drawGlow(sx, sy, 5 + st.w * 2, '205,228,255', 0.9 * sf);
      }

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
  })();
  </script>
  <script>
  (function () {
    'use strict';
    var de = document.documentElement;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var HOME = 'divination-homepage.html';

    /* 门控：入口按 --lo-rest 延迟浮现（见 CSS） */
    if (!reduce) {
      de.classList.add('in-armed');
      de.classList.add('in-show');
    }

    /* 动画期间点页面任意处 = 跳过，直达英雄页；「探索」按钮本身也通向同一页 */
    if (!reduce) {
      document.getElementById('inScene').addEventListener('click', function (e) {
        if (e.target && e.target.closest && e.target.closest('a')) return;  /* 交给按钮默认跳转 */
        window.location.href = HOME;
      });
    }
  })();
  </script>
</body>
