<script>
// ===== Inject corner ornaments =====
(function(){
  var svg = '<svg viewBox="0 0 32 32" fill="none"><path d="M0 0 L22 0 Q18 4, 15 11 Q13 19, 0 26 L0 22 Q11 17, 13 11 Q14 6, 18 3 L0 3 Z" fill="var(--gold)"/><circle cx="6" cy="6" r="2.2" fill="var(--gold)" opacity="0.6"/><path d="M3 3 L16 3 Q13 7, 11 11 Q9 15, 3 19 Z" fill="var(--gold)" opacity="0.25"/></svg>';
  document.querySelectorAll('.corner-ornament').forEach(function(el){ el.innerHTML = svg; });
})();

// ===== State =====
var state = {
  question: '',
  tossCount: 0,
  yaos: [],          // [ {lines: [0/1,0/1,0/1], isChanging: bool}, ... ] 6 entries
  hexLines: [],      // 6 entries: 1=阳, 0=阴
  changingLines: [], // positions 1-6 that are changing
  primaryHex: null,
  changedHex: null,
  gongKey: null
};

// ===== Phase management =====
function showPhase(phaseId) {
  document.querySelectorAll('.phase').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById(phaseId).classList.add('active');

  // Update steps
  var steps = document.querySelectorAll('.step');
  steps.forEach(function(s){ s.classList.remove('active', 'done'); });
  if (phaseId === 'phase-question') {
    steps[0].classList.add('active');
  } else if (phaseId === 'phase-toss') {
    steps[0].classList.add('done');
    steps[1].classList.add('active');
  } else if (phaseId === 'phase-result') {
    steps[0].classList.add('done');
    steps[1].classList.add('done');
    steps[2].classList.add('active');
  }

  // Scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== Phase 1: Question =====
document.getElementById('startTossBtn').addEventListener('click', function(){
  var q = document.getElementById('questionInput').value.trim();
  if (!q) {
    q = '心中所问之事';
  }
  state.question = q;
  state.tossCount = 0;
  state.yaos = [];
  state.hexLines = [];
  state.changingLines = [];
  showPhase('phase-toss');
  updateTossUI();
});

// Suggest tags
document.querySelectorAll('.suggest-tag').forEach(function(tag){
  tag.addEventListener('click', function(){
    document.getElementById('questionInput').value = tag.textContent + '如何？';
  });
});

// ===== Phase 2: Coin Toss =====
function updateTossUI() {
  var count = state.tossCount;
  document.getElementById('tossCount').textContent = count + 1;

  // Render yao build
  var build = document.getElementById('yaoBuild');
  build.innerHTML = '';
  state.yaos.forEach(function(yao, idx){
    var line = document.createElement('div');
    line.className = 'yao-line';
    line.style.animationDelay = (idx * 0.1) + 's';

    var total = yao.lines[0] + yao.lines[1] + yao.lines[2];
    var symbol = document.createElement('span');
    var label = document.createElement('span');

    var yaoNames = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
    label.className = 'yao-label';
    label.textContent = yaoNames[idx];

    if (total === 3) {
      symbol.className = 'yao-symbol changing-yang';
    } else if (total === 0) {
      symbol.className = 'yao-symbol changing-yin';
    } else if (total === 2) {
      symbol.className = 'yao-symbol yang';
    } else {
      symbol.className = 'yao-symbol yin';
    }

    line.appendChild(symbol);
    line.appendChild(label);
    build.appendChild(line);
  });

  // Update button
  var btn = document.getElementById('tossBtn');
  if (count >= 6) {
    btn.disabled = true;
    btn.textContent = '排卦中...';
    setTimeout(function(){ computeResult(); }, 800);
  } else {
    btn.disabled = false;
    btn.textContent = '摇 卦';
  }
}

document.getElementById('tossBtn').addEventListener('click', function(){
  if (state.tossCount >= 6) return;

  var btn = this;
  btn.disabled = true;

  // Animate coins
  var coins = [document.getElementById('coin1'), document.getElementById('coin2'), document.getElementById('coin3')];
  coins.forEach(function(c){
    c.classList.remove('tossing');
    void c.offsetWidth; // force reflow
    c.classList.add('tossing');
  });

  // Determine result after animation
  setTimeout(function(){
    var lines = [];
    var coinFaces = [];
    for (var i = 0; i < 3; i++) {
      // Each coin: 1 = yang (字/正面), 0 = yin (背/反面)
      // Probability: adjust to make it more interesting
      var r = Math.random();
      var val = r < 0.5 ? 1 : 0;
      lines.push(val);
      coinFaces.push(val);
    }

    // Update coin display
    coins.forEach(function(c, idx){
      var face = c.querySelector('.coin-face');
      c.classList.remove('tossing');
      face.className = 'coin-face ' + (coinFaces[idx] ? 'coin-yang' : 'coin-yin');
      face.textContent = coinFaces[idx] ? '乾' : '坤';
    });

    // Determine yao
    var total = lines[0] + lines[1] + lines[2];
    var isChanging = (total === 3 || total === 0);
    var yaoValue = (total >= 2) ? 1 : 0; // 2 or 3 yang = yang; 1 or 0 yang = yin

    state.yaos.push({ lines: lines, isChanging: isChanging });
    state.hexLines.push(yaoValue);
    if (isChanging) {
      state.changingLines.push(state.tossCount + 1);
    }

    state.tossCount++;
    updateTossUI();
  }, 900);
});

// ===== Phase 3: Compute Result =====
function computeResult() {
  // Get hex lines (6, from bottom to top)
  var lines = state.hexLines; // [0]=bottom ... [5]=top

  // Lower trigram (lines 1-3), Upper trigram (lines 4-6)
  var lowerLines = [lines[0], lines[1], lines[2]];
  var upperLines = [lines[3], lines[4], lines[5]];

  var lowerKey = linesToBagua(lowerLines);
  var upperKey = linesToBagua(upperLines);

  state.primaryHex = findHexagram(upperKey, lowerKey);
  state.gongKey = getGong(upperKey, lowerKey);

  // Changed hexagram
  var changedLines = lines.slice();
  state.changingLines.forEach(function(pos){
    changedLines[pos - 1] = flipLine(changedLines[pos - 1]);
  });
  var changedLower = [changedLines[0], changedLines[1], changedLines[2]];
  var changedUpper = [changedLines[3], changedLines[4], changedLines[5]];
  var changedLowerKey = linesToBagua(changedLower);
  var changedUpperKey = linesToBagua(changedUpper);

  if (state.changingLines.length > 0) {
    state.changedHex = findHexagram(changedUpperKey, changedLowerKey);
  } else {
    state.changedHex = null;
  }

  renderResult();
  showPhase('phase-result');
}

function renderResult() {
  // Question
  document.getElementById('resultQuestion').textContent = '「' + state.question + '」';

  // Hexagram display
  var display = document.getElementById('hexagramDisplay');
  display.innerHTML = '';

  var hasChange = state.changingLines.length > 0;

  // Primary hex
  var col1 = document.createElement('div');
  col1.className = 'hex-col';
  col1.innerHTML = '<div class="hex-col-label">' + (hasChange ? '本卦' : '卦象') + '</div>' +
    '<div class="hex-name">' + state.primaryHex.name + '</div>' +
    '<div class="hex-num">第' + state.primaryHex.num + '卦</div>';
  var lines1 = document.createElement('div');
  lines1.className = 'hex-lines';
  for (var i = 5; i >= 0; i--) {
    var line = document.createElement('div');
    line.className = 'hex-line';
    var isChanging = state.changingLines.indexOf(i + 1) !== -1;
    if (isChanging) line.classList.add('changing');
    var symbol = state.hexLines[i] === 1 ? '━━━━━' : '━━ ━━';
    line.textContent = symbol;
    if (isChanging) {
      var mark = document.createElement('span');
      mark.className = 'change-mark';
      mark.textContent = state.hexLines[i] === 1 ? '○' : '✕';
      line.appendChild(mark);
    }
    lines1.appendChild(line);
  }
  col1.appendChild(lines1);
  display.appendChild(col1);

  // Arrow + changed hex
  if (hasChange && state.changedHex) {
    var arrow = document.createElement('div');
    arrow.className = 'hex-arrow';
    arrow.textContent = '→';
    display.appendChild(arrow);

    var col2 = document.createElement('div');
    col2.className = 'hex-col';
    col2.innerHTML = '<div class="hex-col-label">变卦</div>' +
      '<div class="hex-name">' + state.changedHex.name + '</div>' +
      '<div class="hex-num">第' + state.changedHex.num + '卦</div>';
    var lines2 = document.createElement('div');
    lines2.className = 'hex-lines';
    var changedHexLines = state.hexLines.slice();
    state.changingLines.forEach(function(pos){
      changedHexLines[pos - 1] = flipLine(changedHexLines[pos - 1]);
    });
    for (var j = 5; j >= 0; j--) {
      var line2 = document.createElement('div');
      line2.className = 'hex-line';
      line2.textContent = changedHexLines[j] === 1 ? '━━━━━' : '━━ ━━';
      lines2.appendChild(line2);
    }
    col2.appendChild(lines2);
    display.appendChild(col2);
  }

  renderPaipan();
  renderInterpretation();
  initShareWidget();
}

// ===== 分享组件初始化 =====
function initShareWidget() {
  if (typeof ShareWidget === 'undefined') return;
  var hex = state.primaryHex;
  var hasChange = state.changingLines.length > 0;

  var summary = '所问：「' + state.question + '」\n';
  summary += '本卦：' + hex.name + '（第' + hex.num + '卦）';
  if (hasChange && state.changedHex) {
    summary += '\n变卦：' + state.changedHex.name + '（第' + state.changedHex.num + '卦）';
    summary += '\n动爻：' + state.changingLines.length + ' 爻动';
  } else {
    summary += '\n静卦（无动爻）';
  }
  summary += '\n\n' + generateSummary();

  ShareWidget.init({
    title: '六爻占卜 · ' + hex.name,
    type: 'liuyao',
    summary: summary,
    data: {
      question: state.question,
      primaryHex: { name: hex.name, num: hex.num },
      changedHex: hasChange && state.changedHex ? { name: state.changedHex.name, num: state.changedHex.num } : null,
      changingLines: state.changingLines
    }
  });
}

// 获取当日干支（基于当前日期计算）
function getDayGanzhi() {
  // 以2024年1月1日为基准（甲子日），计算当前日期的干支
  var baseDate = new Date(2024, 0, 1); // 2024-01-01
  var today = new Date();
  var diffDays = Math.floor((today - baseDate) / (1000 * 60 * 60 * 24));
  var ganIdx = diffDays % 10;
  var zhiIdx = diffDays % 12;
  if (ganIdx < 0) ganIdx += 10;
  if (zhiIdx < 0) zhiIdx += 12;
  return { gan: Tiangan[ganIdx], zhi: Dizhi[zhiIdx] };
}

// 根据日干获取六神起始（初爻对应的六神）
function getLiushenStart(dayGan) {
  var ganMap = {
    '甲': 0, '乙': 0,   // 青龙起
    '丙': 1, '丁': 1,   // 朱雀起
    '戊': 2,            // 勾陈起
    '己': 3,            // 螣蛇起
    '庚': 4, '辛': 4,   // 白虎起
    '壬': 5, '癸': 5    // 玄武起
  };
  return ganMap[dayGan] || 0;
}

function renderPaipan() {
  var gongKey = state.gongKey;
  var gongWuxing = BaguaGong[gongKey];
  var upperKey = state.primaryHex.upper;
  var lowerKey = state.primaryHex.lower;

  // 获取日干支
  var dayGz = getDayGanzhi();
  var lsStart = getLiushenStart(dayGz.gan);

  var yaoNames = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
  var tbody = document.getElementById('paipanBody');
  tbody.innerHTML = '';

  for (var i = 6; i >= 1; i--) {
    // Determine which trigram this yao belongs to
    var trigramKey = (i <= 3) ? lowerKey : upperKey;
    var najia = Najia[trigramKey][i];
    var gan = najia[0];
    var zhi = najia[1];
    var zhiWx = ZhiWuxing[zhi];
    var lq = getLiuqin(gongWuxing, zhiWx);
    // 六神按日干起，从初爻开始顺序排列
    var ls = Liushen[(lsStart + i - 1) % 6];
    var isChanging = state.changingLines.indexOf(i) !== -1;

    var tr = document.createElement('tr');
    if (isChanging) tr.classList.add('changing-row');

    tr.innerHTML =
      '<td class="yao-pos">' + yaoNames[i-1] + '</td>' +
      '<td>' + ls + '</td>' +
      '<td class="liuqin-cell liuqin-' + lq + '">' + lq + '</td>' +
      '<td>' + gan + zhi + '</td>' +
      '<td>' + zhiWx + '</td>' +
      '<td>' + (isChanging ? (state.hexLines[i-1] === 1 ? '○ 动' : '✕ 动') : '—') + '</td>';
    tbody.appendChild(tr);
  }
}

// 浅层断语（免费预览，仅给出大致方向，不含深度分析）
function generateShallowInterp() {
  var hex = state.primaryHex;
  var hasChange = state.changingLines.length > 0;
  var gongKey = state.gongKey;
  var gongWuxing = BaguaGong[gongKey];
  var gongName = Bagua[gongKey].name + '宫';

  var shallow = '';

  // 1. 依据卦名与卦宫概括大致主题
  var hexTheme = {
    1: '刚健进取', 2: '柔顺承载',
    3: '初创艰难', 4: '启蒙求问',
    5: '等待时机', 6: '争讼是非',
    7: '兴师动众', 8: '亲附聚合',
    11: '通达顺遂', 12: '闭塞停滞',
    14: '丰盛大有', 24: '转机复苏',
    34: '声势壮大', 63: '已成初定', 64: '未成将成'
  };
  var theme = hexTheme[hex.num] || '审时度势';
  shallow += '此卦为「' + hex.name + '」，属' + gongName + '（' + gongWuxing + '），总体关乎' + theme + '之事。';

  // 2. 点明动静趋势（动爻 / 静卦）
  if (hasChange) {
    shallow += '卦中有动爻，事态正在转化，宜留意变化之机。';
  } else {
    shallow += '卦为静卦，事态暂趋平稳，宜守正待时。';
  }

  // 3. 一句话方向性提示，不展开具体分析
  shallow += '至于吉凶趋势与用神生克之细辨，详见下方深度解读。';

  return shallow;
}

function renderInterpretation() {
  var interp = document.getElementById('interpretation');
  var hex = state.primaryHex;
  var hasChange = state.changingLines.length > 0;
  var gongKey = state.gongKey;
  var gongWuxing = BaguaGong[gongKey];
  var gongName = Bagua[gongKey].name + '宫';

  var html = '';

  // 1. 卦辞
  html += '<div class="interp-section">';
  html += '<div class="interp-title">卦辞<span class="section-tag free">免费</span></div>';
  html += '<div class="interp-text"><span class="quote">' + hex.guaci + '</span></div>';
  html += '</div>';

  // 2. 象辞
  html += '<div class="interp-section">';
  html += '<div class="interp-title">象辞<span class="section-tag free">免费</span></div>';
  html += '<div class="interp-text"><span class="quote">' + hex.xici + '</span></div>';
  html += '</div>';

  // 3. 卦宫信息
  html += '<div class="interp-section">';
  html += '<div class="interp-title">卦宫<span class="section-tag free">免费</span></div>';
  html += '<div class="interp-text">此卦属<span class="highlight">' + gongName + '</span>（' + gongWuxing + '），';
  if (hasChange) {
    html += '有<span class="highlight">' + state.changingLines.length + '个动爻</span>，事情正在变化之中。';
    html += '由「<span class="highlight">' + hex.name + '</span>」变为「<span class="highlight">' + state.changedHex.name + '</span>」。';
  } else {
    html += '为<span class="highlight">静卦</span>，事情处于稳定状态，暂无显著变化。';
  }
  html += '</div></div>';

  // 4. 浅层断语（免费预览）
  html += '<div class="interp-section">';
  html += '<div class="interp-title">浅层断语<span class="section-tag free">免费</span></div>';
  html += '<div class="interp-text">' + generateShallowInterp() + '</div>';
  html += '</div>';

  // 5. 动爻爻辞 (PREMIUM)
  if (hasChange) {
    html += '<div class="interp-section premium">';
    html += '<div class="interp-title">动爻爻辞<span class="section-tag premium">深度</span></div>';
    state.changingLines.forEach(function(pos){
      var yaoKey = hex.num + '-' + pos;
      var yaoText = Yaoci[yaoKey];
      var yaoNames = ['初', '二', '三', '四', '五', '上'];
      html += '<div class="interp-text">';
      html += '<span class="highlight">' + yaoNames[pos-1] + '爻</span>（' + (state.hexLines[pos-1] === 1 ? '阳' : '阴') + '）：';
      if (yaoText) {
        html += '<span class="quote">' + yaoText + '</span>';
      } else {
        html += '爻辞待补。';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  // 6. 用神分析 (PREMIUM)
  html += '<div class="interp-section premium">';
  html += '<div class="interp-title">用神分析<span class="section-tag premium">深度</span></div>';
  var yongshen = analyzeYongshen(state.question);
  html += '<div class="interp-text">';
  html += '测<span class="highlight">' + yongshen.category + '</span>，以<span class="highlight">' + yongshen.target + '</span>为用神。';
  html += yongshen.advice;
  html += '</div></div>';

  // 7. 综合断语 (PREMIUM)
  html += '<div class="interp-section premium">';
  html += '<div class="interp-title">综合断语<span class="section-tag premium">深度</span></div>';
  html += '<div class="interp-text">' + generateSummary() + '</div>';
  html += '</div>';

  interp.innerHTML = html;

  // Lock premium sections
  if (typeof PremiumLock !== 'undefined') {
    PremiumLock.lockSections(interp, ['.interp-section.premium'], {
      hint: '添加微信客服获取一对一深度解读'
    });
    // Append consultation section
    PremiumLock.appendConsultation(interp, {
      title: '真人深度解读',
      desc: '由专业解读师一对一深度分析，结合易理纳甲与五行生克，为您提供个性化的文化探索指引。'
    });
  }
}

// 用神分析（根据问题关键词）
function analyzeYongshen(question) {
  var q = question.toLowerCase();
  var category = '泛问';
  var target = '世爻';
  var advice = '';

  if (q.indexOf('财') !== -1 || q.indexOf('钱') !== -1 || q.indexOf('收入') !== -1 || q.indexOf('生意') !== -1 || q.indexOf('投资') !== -1) {
    category = '财运';
    target = '妻财爻';
    advice = '财爻旺相则财源广进，休囚空破则财运不佳。';
  } else if (q.indexOf('感情') !== -1 || q.indexOf('恋爱') !== -1 || q.indexOf('婚姻') !== -1 || q.indexOf('复合') !== -1 || q.indexOf('对象') !== -1 || q.indexOf('桃花') !== -1) {
    category = '感情';
    target = '妻财爻（男测）/ 官鬼爻（女测）';
    advice = '用神旺相生世则感情和顺，刑冲克害则多有波折。';
  } else if (q.indexOf('事业') !== -1 || q.indexOf('工作') !== -1 || q.indexOf('升职') !== -1 || q.indexOf('求职') !== -1) {
    category = '事业';
    target = '官鬼爻';
    advice = '官鬼旺相生世则事业有成，休囚受克则事业受阻。';
  } else if (q.indexOf('考') !== -1 || q.indexOf('学') !== -1 || q.indexOf('成绩') !== -1) {
    category = '考试学业';
    target = '父母爻';
    advice = '父母爻旺相则学业有成、考试顺利，受克则需多加努力。';
  } else if (q.indexOf('病') !== -1 || q.indexOf('健康') !== -1 || q.indexOf('身体') !== -1) {
    category = '健康';
    target = '官鬼爻';
    advice = '官鬼为病，旺相则病重，休囚受克则病轻将愈。';
  } else if (q.indexOf('人') !== -1 && (q.indexOf('关系') !== -1 || q.indexOf('相处') !== -1)) {
    category = '人际关系';
    target = '兄弟爻';
    advice = '兄弟爻旺相则朋友众多，太过则竞争激烈。';
  } else {
    category = '所问之事';
    target = '世爻';
    advice = '世爻代表自身，旺相则自身有力，休囚则自身力弱。';
  }

  return { category: category, target: target, advice: advice };
}

function generateSummary() {
  var hex = state.primaryHex;
  var hasChange = state.changingLines.length > 0;
  var changeCount = state.changingLines.length;

  var summary = '此卦为「' + hex.name + '」，';

  // 根据卦名给出大致方向
  var hexFortune = {
    1: '刚健中正，大有可为之时。', 2: '柔顺包容，宜守不宜进。',
    11: '天地交泰，万事亨通。', 12: '天地不交，闭塞不通。', 24: '一阳来复，否极泰来。',
    14: '大有所获，光明在上。', 34: '势不可挡，但需守正。', 63: '事已成功，需防患于未然。', 64: '事未成，仍有变数。'
  };

  if (hexFortune[hex.num]) {
    summary += hexFortune[hex.num];
  } else {
    summary += '宜细参卦象爻辞，审时度势。';
  }

  if (hasChange) {
    if (changeCount === 1) {
      summary += '卦中一爻动，事有专指，以动爻爻辞为主断。';
    } else if (changeCount === 2) {
      summary += '卦中两爻动，以上爻为主断。';
    } else if (changeCount === 3) {
      summary += '卦中三爻动，以本卦与变卦卦辞合断。';
    } else if (changeCount === 4) {
      summary += '卦中四爻动，以变卦中不动的两爻爻辞断。';
    } else if (changeCount === 5) {
      summary += '卦中五爻动，以变卦中不动的一爻爻辞断。';
    } else {
      summary += '卦中六爻皆动，以变卦卦辞断。';
    }
    summary += '由「' + hex.name + '」变为「' + state.changedHex.name + '」，事态在转化之中。';
  } else {
    summary += '卦无动爻，为静卦，以卦辞象辞为主断，事态相对稳定。';
  }

  summary += ' 占卜之道，贵在变通，卦象仅为参考，最终仍需结合实际处境做出判断。';

  return summary;
}

// ===== Restart =====
document.getElementById('restartBtn').addEventListener('click', function(){
  state = {
    question: '', tossCount: 0, yaos: [], hexLines: [],
    changingLines: [], primaryHex: null, changedHex: null, gongKey: null
  };
  document.getElementById('questionInput').value = '';
  document.getElementById('yaoBuild').innerHTML = '';
  // Reset coins
  ['coin1','coin2','coin3'].forEach(function(id){
    var c = document.getElementById(id);
    var face = c.querySelector('.coin-face');
    c.classList.remove('tossing');
    face.className = 'coin-face coin-yang';
    face.textContent = '乾';
  });
  showPhase('phase-question');
});
