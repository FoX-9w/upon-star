<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upon Star · 八字排盘</title>
<style>
/* ===== TOKENS ===== */
:root {
  --bg: #040408;
  --bg2: #08080e;
  --surface: #0c0c14;
  --surface-light: #12121e;
  --ink: #f0ece4;
  --ink-dim: #a09888;
  --muted: #605850;
  --rule: rgba(200, 164, 92, 0.12);
  --rule-bright: rgba(200, 164, 92, 0.25);
  --gold: #c8a45c;
  --gold-light: #e0c078;
  --gold-dim: #8a7040;
  --gold-glow: rgba(200, 164, 92, 0.08);
  --wood: #5a9a6a;
  --fire: #c06040;
  --earth: #b09050;
  --metal: #c0c0a0;
  --water: #5080a0;
  --radius: 6px;
  --radius-card: 10px;
  --radius-full: 999px;
  --font-serif: Georgia, 'Songti SC', serif;
  --font-sans: 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;
  --font-display: 'Times New Roman', Georgia, serif;
}

/* ===== BASE ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.7 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

/* ===== SACRED LIGHT ===== */
.sacred-light {
  position: fixed; top: -30%; left: 50%; transform: translateX(-50%);
  width: 1400px; height: 900px;
  background: radial-gradient(ellipse at center, rgba(200,164,92,0.06) 0%, rgba(200,164,92,0.02) 30%, transparent 65%);
  pointer-events: none; z-index: 1;
  animation: sacredPulse 8s ease-in-out infinite;
}
@keyframes sacredPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.rim-light-left, .rim-light-right {
  position: fixed; top: 0; width: 120px; height: 100vh; pointer-events: none; z-index: 1;
}
.rim-light-left { left: 0; background: linear-gradient(to right, rgba(200,164,92,0.04), transparent); }
.rim-light-right { right: 0; background: linear-gradient(to left, rgba(200,164,92,0.04), transparent); }

/* ===== NAV ===== */
.sticky-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(4,4,8,0.88); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule); padding: 12px 0 10px;
}
.nav-inner {
  max-width: 900px; margin: 0 auto; padding: 0 24px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.logo {
  font: 400 20px var(--font-display); color: var(--gold);
  letter-spacing: 4px;
}
.logo span { color: var(--ink-dim); font-size: 14px; }
.back-link {
  color: var(--ink-dim); text-decoration: none;
  font: 400 12px var(--font-sans); letter-spacing: 1.5px; transition: color 0.3s;
}
.back-link:hover { color: var(--gold); }

/* ===== CONTAINER ===== */
.container {
  max-width: 900px; margin: 0 auto; padding: 48px 24px 80px;
  position: relative; z-index: 2;
}

/* ===== STEP ===== */
.steps {
  display: flex; justify-content: center; gap: 0; margin-bottom: 48px;
}
.step { display: flex; align-items: center; gap: 12px; opacity: 0.3; transition: opacity 0.4s; }
.step.active { opacity: 1; }
.step.done { opacity: 0.6; }
.step-num {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--gold-dim); display: flex; align-items: center; justify-content: center;
  font: 400 13px var(--font-sans); color: var(--gold-dim); transition: all 0.4s;
}
.step.active .step-num {
  border-color: var(--gold); color: var(--gold-light);
  background: rgba(200,164,92,0.08); box-shadow: 0 0 20px rgba(200,164,92,0.1);
}
.step.done .step-num { border-color: var(--gold-dim); background: rgba(200,164,92,0.04); }
.step-label { font: 400 12px var(--font-sans); letter-spacing: 1px; color: var(--ink-dim); }
.step.active .step-label { color: var(--gold-light); }
.step-line { width: 48px; height: 1px; background: var(--rule); margin: 0 8px; }

/* ===== PHASE ===== */
.phase { display: none; animation: fadeIn 0.6s ease; }
.phase.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.phase-header { text-align: center; margin-bottom: 40px; }
.phase-header h2 { font: 400 32px/1.2 var(--font-display); letter-spacing: 3px; margin-bottom: 12px; }
.phase-header .ornament {
  width: 100px; height: 1px; margin: 16px auto; display: block;
  background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent);
  opacity: 0.5; position: relative;
}
.phase-header .ornament::before, .phase-header .ornament::after {
  content: ''; position: absolute; top: -2px; width: 5px; height: 5px;
  background: var(--gold); border-radius: 50%; opacity: 0.35;
}
.phase-header .ornament::before { left: 20%; }
.phase-header .ornament::after { right: 20%; }
.phase-header p {
  color: var(--ink-dim); font: 400 13px var(--font-sans);
  letter-spacing: 1px; max-width: 480px; margin: 0 auto;
}

/* ===== INPUT CARD ===== */
.input-card {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius-card); padding: 32px; position: relative; overflow: hidden;
}
.input-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.3;
}
.input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; position: relative; z-index: 1; }
.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-group.full-width { grid-column: 1 / -1; }
.input-group label {
  font: 500 11px var(--font-sans); letter-spacing: 1.5px; color: var(--gold); text-transform: uppercase;
}
.input-group input, .input-group select {
  padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--rule);
  background: var(--bg2); color: var(--ink); font: 400 14px var(--font-sans);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.input-group input:focus, .input-group select:focus {
  outline: none; border-color: var(--gold-dim); box-shadow: 0 0 20px rgba(200,164,92,0.06);
}
.input-group input::placeholder { color: var(--muted); }
.input-group select { cursor: pointer; }
.input-group select option { background: var(--bg2); color: var(--ink); }

.calendar-toggle { display: flex; gap: 0; }
.calendar-toggle button {
  padding: 8px 20px; border: 1px solid var(--rule);
  background: var(--bg2); color: var(--ink-dim); font: 400 12px var(--font-sans);
  cursor: pointer; transition: all 0.3s;
}
.calendar-toggle button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.calendar-toggle button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.calendar-toggle button.active {
  border-color: var(--gold-dim); color: var(--gold-light); background: rgba(200,164,92,0.06);
}

/* ===== BTN ===== */
.btn-primary {
  display: block; width: 100%; padding: 16px; border-radius: var(--radius-full);
  border: 1px solid var(--gold-dim); background: rgba(200,164,92,0.06);
  color: var(--gold-light); font: 500 14px var(--font-sans); letter-spacing: 2px;
  cursor: pointer; transition: all 0.4s; margin-top: 28px; position: relative; overflow: hidden;
}
.btn-primary::before {
  content: ''; position: absolute; top: -1px; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-light), transparent); opacity: 0.6;
}
.btn-primary:hover { background: rgba(200,164,92,0.1); box-shadow: 0 0 32px rgba(200,164,92,0.08); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  padding: 14px 32px; border-radius: var(--radius-full);
  border: 1px solid var(--rule-bright); background: transparent;
  color: var(--ink-dim); font: 500 13px var(--font-sans); letter-spacing: 1.5px;
  cursor: pointer; transition: all 0.3s; text-decoration: none;
}
.btn-secondary:hover { border-color: var(--gold-dim); color: var(--gold); }

/* ===== RESULT CARD ===== */
.result-card {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: var(--radius-card); padding: 40px 32px; position: relative; overflow: hidden;
  margin-bottom: 32px;
}
.result-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.3;
}
.result-card::after {
  content: ''; position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
  width: 400px; height: 300px;
  background: radial-gradient(ellipse at center, rgba(200,164,92,0.04), transparent 70%);
  pointer-events: none;
}
.person-header { text-align: center; margin-bottom: 32px; position: relative; z-index: 1; }
.person-name { font: 400 24px var(--font-serif); color: var(--ink); margin-bottom: 4px; }
.person-birth { font: 400 12px var(--font-sans); color: var(--muted); letter-spacing: 1px; }

.dm-section { text-align: center; margin-bottom: 32px; position: relative; z-index: 1; }
.dm-badge {
  display: inline-block; padding: 12px 32px;
  border: 1px solid var(--gold-dim); border-radius: var(--radius-full);
  background: rgba(200,164,92,0.06);
}
.dm-char { font: 400 48px var(--font-serif); color: var(--gold-light); display: block; line-height: 1.2; }
.dm-meta { font: 400 12px var(--font-sans); color: var(--gold-dim); letter-spacing: 1px; margin-top: 4px; }
.dm-desc { font: 400 11px var(--font-sans); color: var(--muted); letter-spacing: 1px; margin-top: 8px; }

/* ===== PILLARS ===== */
.pillars-section { margin-bottom: 32px; position: relative; z-index: 1; }
.pillars-section-title {
  font: 400 14px var(--font-sans); color: var(--gold); letter-spacing: 2px;
  text-align: center; margin-bottom: 20px; text-transform: uppercase;
}
.pillars-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.pillar-card {
  border: 1px solid var(--rule); border-radius: var(--radius-card);
  padding: 20px 12px; text-align: center; position: relative;
  background: rgba(12,12,20,0.5);
  transition: border-color 0.3s;
}
.pillar-card:hover { border-color: var(--rule-bright); }
.pillar-label { font: 400 10px var(--font-sans); color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }
.pillar-stem { font: 400 36px var(--font-serif); color: var(--gold-light); display: block; line-height: 1.2; }
.pillar-branch { font: 400 36px var(--font-serif); color: var(--gold); display: block; line-height: 1.2; margin-bottom: 8px; }
.pillar-ganzhi { font: 400 14px var(--font-serif); color: var(--ink-dim); margin-bottom: 12px; }
.pillar-detail { font: 400 11px var(--font-sans); color: var(--ink-dim); padding: 2px 0; }
.pillar-detail .label { color: var(--muted); }
.pillar-detail .wood { color: var(--wood); }
.pillar-detail .fire { color: var(--fire); }
.pillar-detail .earth { color: var(--earth); }
.pillar-detail .metal { color: var(--metal); }
.pillar-detail .water { color: var(--water); }

.pillar-hidden { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); }
.pillar-hidden-title { font: 400 9px var(--font-sans); color: var(--muted); letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
.pillar-hidden-stem {
  display: inline-block; margin: 2px 4px; padding: 2px 8px;
  border-radius: 3px; font: 400 12px var(--font-serif); position: relative;
}
.pillar-hidden-stem.main { color: var(--gold-light); background: rgba(200,164,92,0.08); }
.pillar-hidden-stem.hidden { color: var(--ink-dim); background: rgba(255,255,255,0.03); }
.pillar-hidden-stem .tag { font: 400 8px var(--font-sans); display: block; color: var(--muted); }

/* ===== ELEMENTS ===== */
.elements-section { margin-bottom: 32px; position: relative; z-index: 1; }
.elements-section-title {
  font: 400 14px var(--font-sans); color: var(--gold); letter-spacing: 2px;
  text-align: center; margin-bottom: 20px; text-transform: uppercase;
}
.elements-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.element-bar { text-align: center; }
.element-label { font: 400 12px var(--font-sans); letter-spacing: 1px; margin-bottom: 8px; }
.element-bar-track {
  width: 100%; height: 100px; background: var(--bg2); border-radius: 4px;
  position: relative; overflow: hidden; border: 1px solid var(--rule);
}
.element-bar-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  border-radius: 4px 4px 0 0; transition: height 0.8s ease;
}
.element-count { font: 400 13px var(--font-sans); margin-top: 8px; }
.el-wood { color: var(--wood); } .el-fire { color: var(--fire); }
.el-earth { color: var(--earth); } .el-metal { color: var(--metal); } .el-water { color: var(--water); }
.bg-wood { background: var(--wood); } .bg-fire { background: var(--fire); }
.bg-earth { background: var(--earth); } .bg-metal { background: var(--metal); } .bg-water { background: var(--water); }

/* ===== DA YUN ===== */
.dayun-section { margin-bottom: 32px; position: relative; z-index: 1; }
.dayun-section-title {
  font: 400 14px var(--font-sans); color: var(--gold); letter-spacing: 2px;
  text-align: center; margin-bottom: 20px; text-transform: uppercase;
}
.dayun-timeline { position: relative; }
.dayun-timeline::before {
  content: ''; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 1px; background: var(--rule); transform: translateX(-50%);
}
.dayun-item { display: flex; align-items: center; margin-bottom: 16px; position: relative; }
.dayun-item:nth-child(even) { flex-direction: row-reverse; }
.dayun-content {
  flex: 1; padding: 12px 20px; border: 1px solid var(--rule);
  border-radius: var(--radius-card); background: rgba(12,12,20,0.5);
  max-width: 45%; transition: border-color 0.3s;
}
.dayun-content:hover { border-color: var(--rule-bright); }
.dayun-center {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--gold-dim); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; z-index: 1; margin: 0 16px;
  transition: all 0.3s;
}
.dayun-item:hover .dayun-center {
  border-color: var(--gold); background: rgba(200,164,92,0.08);
  box-shadow: 0 0 16px rgba(200,164,92,0.1);
}
.dayun-center .num { font: 400 12px var(--font-sans); color: var(--gold-dim); }
.dayun-ganzhi { font: 400 18px var(--font-serif); color: var(--gold-light); display: block; }
.dayun-age { font: 400 11px var(--font-sans); color: var(--muted); display: block; margin-top: 4px; }
.dayun-tenGod { font: 400 11px var(--font-sans); color: var(--ink-dim); display: block; margin-top: 2px; }

/* ===== CALENDAR INFO ===== */
.calendar-info { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; position: relative; z-index: 1; }
.cal-info-item { text-align: center; padding: 12px 20px; border: 1px solid var(--rule); border-radius: var(--radius); background: rgba(12,12,20,0.5); min-width: 100px; }
.cal-info-label { font: 400 9px var(--font-sans); color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.cal-info-value { font: 400 16px var(--font-serif); color: var(--ink); margin-top: 4px; }

/* ===== INTERACTIONS ===== */
.interactions-section { margin-bottom: 28px; position: relative; z-index: 1; }
.interactions-section-title {
  font: 400 14px var(--font-sans); color: var(--gold); letter-spacing: 2px;
  text-align: center; margin-bottom: 20px; text-transform: uppercase;
}
.interaction-item { text-align: center; padding: 12px; border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: 8px; background: rgba(12,12,20,0.5); }
.interaction-type { font: 500 11px var(--font-sans); color: var(--gold); letter-spacing: 1px; }
.interaction-desc { font: 400 13px var(--font-serif); color: var(--ink-dim); margin-top: 4px; }

/* ===== RESULT ACTIONS ===== */
.result-actions { display: flex; gap: 16px; justify-content: center; margin-top: 32px; }
.restart-main {
  width: auto;
  min-width: 200px;
  margin-top: 0;
  padding: 16px 40px;
  border-color: var(--gold);
  background: rgba(200,164,92,0.12);
  color: var(--gold-light);
  font-size: 15px;
  letter-spacing: 3px;
  box-shadow: 0 0 24px rgba(200,164,92,0.1);
}

/* ===== LOADING ===== */
.loading { text-align: center; padding: 60px 0; position: relative; z-index: 1; }
.loading-spinner { display: inline-block; width: 40px; height: 40px; border: 2px solid var(--rule); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font: 400 13px var(--font-sans); color: var(--ink-dim); margin-top: 16px; letter-spacing: 1px; }

/* ===== ERROR ===== */
.error-msg { text-align: center; padding: 20px; color: var(--fire); font: 400 13px var(--font-sans); border: 1px solid rgba(192,96,64,0.3); border-radius: var(--radius); background: rgba(192,96,64,0.05); margin-top: 16px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 700px) {
  .container { padding: 32px 16px 60px; }
  .phase-header h2 { font-size: 24px; }
  .input-grid { grid-template-columns: 1fr; }
  .pillars-grid { grid-template-columns: repeat(2, 1fr); }
  .elements-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .element-bar-track { height: 60px; }
  .dayun-timeline::before { left: 16px; }
  .dayun-item { flex-direction: row !important; }
  .dayun-content { max-width: 70%; }
  .dayun-center { margin: 0 12px 0 0; width: 28px; height: 28px; }
  .step-label { display: none; }
  .step-line { width: 24px; }
  .cal-info-item { min-width: 80px; padding: 8px 12px; }
  .dm-char { font-size: 36px; }
  .pillar-stem, .pillar-branch { font-size: 28px; }
}

/* ===== SHARE NOTE ===== */
.share-note {
  text-align: center; padding: 12px; border: 1px dashed var(--rule-bright);
  border-radius: var(--radius); margin-bottom: 24px; font: 400 11px var(--font-sans);
  color: var(--muted); letter-spacing: 1px; position: relative; z-index: 1;
}
</style>
</head>
<body>

<div class="sacred-light"></div>
<div class="rim-light-left"></div>
<div class="rim-light-right"></div>

<div class="sticky-nav">
  <div class="nav-inner">
    <div class="logo">Upon Star <span>·</span> 八字</div>
    <span class="back-link" style="font-size:11px;color:var(--muted);">纯前端版 · 无需服务器</span>
  </div>
</div>

<div class="container">

  <div class="steps">
    <div class="step active" id="step-1">
      <div class="step-num">1</div>
      <div class="step-label">输入生辰</div>
    </div>
    <div class="step-line"></div>
    <div class="step" id="step-2">
      <div class="step-num">2</div>
      <div class="step-label">排盘展示</div>
    </div>
  </div>

  <!-- 输入阶段 -->
  <div class="phase active" id="phase-input">
    <div class="phase-header">
      <h2>输入生辰</h2>
      <div class="ornament"></div>
      <p>公历 · 年月日时 · 尽精微</p>
    </div>

    <div class="share-note">📄 此为纯前端页面，无需网络，直径分享 HTML 文件即可使用</div>

    <div class="input-card">
      <div class="input-grid">
        <div class="input-group full-width">
          <label>称呼（选填）</label>
          <input type="text" id="nameInput" placeholder="请输入您的姓名或昵称" maxlength="20">
        </div>
        <div class="input-group">
          <label>性别</label>
          <select id="genderInput">
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
        <div class="input-group">
          <label>出生年份</label>
          <input type="number" id="yearInput" placeholder="如：1990" min="1900" max="2100" value="1990">
        </div>
        <div class="input-group">
          <label>出生月份</label>
          <input type="number" id="monthInput" placeholder="如：6" min="1" max="12" value="6">
        </div>
        <div class="input-group">
          <label>出生日期</label>
          <input type="number" id="dayInput" placeholder="如：15" min="1" max="31" value="15">
        </div>
        <div class="input-group">
          <label>出生时间</label>
          <div style="display:flex;gap:8px;">
            <input type="number" id="hourInput" placeholder="时" min="0" max="23" style="flex:1;" value="12">
            <span style="color:var(--muted);line-height:44px;">:</span>
            <input type="number" id="minuteInput" placeholder="分" min="0" max="59" style="flex:1;" value="0">
          </div>
        </div>
        <div class="input-group full-width">
          <label>出生地区（用于真太阳时校正）</label>
          <select id="locationInput">
            <option value="116.39">北京</option>
            <option value="121.47">上海</option>
            <option value="113.27">广州</option>
            <option value="114.07">深圳</option>
            <option value="120.15">杭州</option>
            <option value="104.07">成都</option>
            <option value="114.30">武汉</option>
            <option value="108.95">西安</option>
            <option value="118.78">南京</option>
            <option value="106.55">重庆</option>

    1994:'1994-02-10', 1995:'1995-01-31', 1996:'1996-02-19', 1997:'1997-02-07',
    1998:'1998-01-28', 1999:'1999-02-16', 2000:'2000-02-05', 2001:'2001-01-24',
    2002:'2002-02-12', 2003:'2003-02-01', 2004:'2004-01-22', 2005:'2005-02-09',
    2006:'2006-01-29', 2007:'2007-02-18', 2008:'2008-02-07', 2009:'2009-01-26',
    2010:'2010-02-14', 2011:'2011-02-03', 2012:'2012-01-23', 2013:'2013-02-10',
    2014:'2014-01-31', 2015:'2015-02-19', 2016:'2016-02-08', 2017:'2017-01-28',

    1965:'1965-02-02', 1964:'1964-01-25', 1963:'1963-02-04', 1962:'1962-02-15',
    1961:'1961-02-02', 1960:'1960-02-14', 1959:'1959-02-08', 1958:'1958-02-18',
    1957:'1957-02-07', 1956:'1956-01-24', 1955:'1955-02-02', 1954:'1954-02-14',
    1953:'1953-02-14', 1952:'1952-02-15', 1951:'1951-01-29', 1950:'1950-02-12',
    1949:'1949-02-01', 1948:'1948-01-22', 1947:'1947-02-10', 1946:'1946-01-22',
    1945:'1945-02-04', 1944:'1944-02-04', 1943:'1943-01-25', 1942:'1942-02-06',
    1941:'1941-02-05', 1940:'1940-01-26', 1939:'1939-02-08', 1938:'1938-02-04'
  };
  if (lunarNewYear[year]) return lunarNewYear[year];
  // 估算：从已知年份推算（每19年接近一个循环）
  var base = 1990;
  var baseStr = '1990-02-15';
  var diff = year - base;
  // 粗略估算，每年正月初一平均提前11天
  var dayOffset = diff * 11;
  var d = new Date(1990, 1, 15 + dayOffset);
  // 纠正到1-2月
  while (d.getMonth() < 1) d.setDate(d.getDate() + 30);
  while (d.getMonth() > 1) d.setDate(d.getDate() - 30);
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), da = String(d.getDate()).padStart(2,'0');

// 日期转儒略日数
function dateToJD(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  var A = Math.floor(y/100);
  var B = 2 - A + Math.floor(A/4);
  return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524.5;
}

// 公历日期对应的农历日期（简化估算）
function solarToLunar(y, m, d) {
  var newYearStr = lunarNewYearDay(y);
  var ny = parseInt(newYearStr.split('-')[0]);
  var nm = parseInt(newYearStr.split('-')[1]);
  var nd = parseInt(newYearStr.split('-')[2]);
  var jd1 = dateToJD(y, m, d);
  var jd2 = dateToJD(ny, nm, nd);
  var dayDiff = Math.round(jd1 - jd2);
  if (dayDiff < 0) {
    // 还在去年农历年
    var prevNewYearStr = lunarNewYearDay(y - 1);
    var pny = parseInt(prevNewYearStr.split('-')[0]);
    var pnm = parseInt(prevNewYearStr.split('-')[1]);
    var pnd = parseInt(prevNewYearStr.split('-')[2]);
    var jdPrev = dateToJD(pny, pnm, pnd);
    dayDiff = Math.round(jd1 - jdPrev);
  }
  // 估算月日
  var month = 1;
  var day = dayDiff + 1;
  // 每月约29.5天
  while (day > 30) { day -= 29; month++; }
  return { year: (dayDiff >= 0) ? y : y-1, month: month, day: day, isLeapMonth: false };
}

// ===== 八字核心计算 =====

// 计算年柱天干
function getYearStem(year) {
  // 以立春为界
  return TIANGAN[(year - 4) % 10];
}
function getYearBranch(year) {
  return DIZHI[(year - 4) % 12];
}

// 计算月柱（节气分界）
function getMonthStem(year, month, day) {
  // 月干口诀：甲己之年丙作首，乙庚之年戊为头
  // 丙辛必定寻庚起，丁壬壬位顺行求，戊癸之年何方发，甲寅之上好追求
  var yearStem = getYearStem(year);
  // 正确的月干起点：甲己→丙(2), 乙庚→戊(4), 丙辛→庚(6), 丁壬→壬(8), 戊癸→甲(0)
  var monthStems = {
    '甲':2,'己':2,  // 甲己年起丙月
    '乙':4,'庚':4,  // 乙庚年起戊月
    '丙':6,'辛':6,  // 丙辛年起庚月
    '丁':8,'壬':8,  // 丁壬年起壬月
    '戊':0,'癸':0   // 戊癸年起甲月
  };
  var start = monthStems[yearStem] !== undefined ? monthStems[yearStem] : 0;
  // 月支偏移：寅月=0(2月), 卯月=1(3月), ..., 丑月=11(1月)
  var monthOffset = (month + 10) % 12;
  return TIANGAN[(start + monthOffset) % 10];
}
function getMonthBranch(month) {
  // 正月寅(2月)，二月卯(3月)...十二月丑(1月)
  return DIZHI[month % 12];
}

// 计算日柱（1900-2100年日干表）
// 参考点：1900-01-01 为甲戌日（六十甲子第11位，索引10）
function getDayStemAndBranch(year, month, day) {
  var dayCount = dateToJD(year, month, day) - dateToJD(1900, 1, 1) + 1;
  // 1900-01-01 = 甲戌 = 索引10，dayCount=1 时需要 offset=10，故 +9
  var offset = (dayCount + 9) % 60;
  if (offset < 0) offset += 60;
  var stem = TIANGAN[offset % 10];
  var branch = DIZHI[offset % 12];
  return { stem: stem, branch: branch };
}

// 计算时柱（以中气为界）
function getHourStemAndBranch(hour) {
  // 23:00-1:00 为子时
  var zhiIndex = Math.floor((hour + 1) / 2) % 12;
  var branch = DIZHI[zhiIndex];
  // 日干起时干口诀：甲己还生甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸何方发，壬子是真途
  // 以日干的时干起点
  return { branch: branch, zhiIndex: zhiIndex };
}
function getHourStem(dayStem, hour) {
  var hourZhiIndex = Math.floor((hour + 1) / 2) % 12;
  var dayStemIndex = TIANGAN.indexOf(dayStem);
  // 时干起点口诀：甲己还生甲(0)，乙庚丙作初(2)，丙辛从戊起(4)，丁壬庚子居(6)，戊癸壬子是真途(8)
  var startTable = { 0:0, 1:2, 2:4, 3:6, 4:8, 5:0, 6:2, 7:4, 8:6, 9:8 };
  var start = startTable[dayStemIndex] !== undefined ? startTable[dayStemIndex] : 0;
  return TIANGAN[(start + hourZhiIndex) % 10];
}

// ===== 藏干计算 =====
function getHiddenStems(branchChar) {
  var cang = ZHI_CANGGAN[branchChar] || [branchChar];
  var main = ZHI_MAIN_GAN[branchChar] || cang[0];
  return cang.map(function(s, i) {
    return {
      stem: s,
      tenGod: SHISHEN[main] ? (SHISHEN[main][s] || '杂气') : '杂气',
      isMain: s === main
    };
  });
}

// ===== 十神计算 =====
function getTenGod(dayStem, otherStem) {
  return SHISHEN[dayStem] ? (SHISHEN[dayStem][otherStem] || '') : '';
}

// ===== 长生宫位 =====
function getGrowthStage(stem, branch) {
  var branchIndex = DIZHI.indexOf(branch);
  var stages = CHANG_SHENG[stem] || CHANG_SHENG['甲'];
  return stages[branchIndex] || '';
}

// ===== 大运计算 =====
// 大运从月柱起算，阳年男/阴年女顺排，阴年男/阳年女逆排
// 顺排取月柱之后第一柱，逆排取月柱之前第一柱
function calculateDaYun(monthStem, monthBranch, dayStem, birthDay, isForward) {
  var stemIdx = TIANGAN.indexOf(monthStem);
  var branchIdx = DIZHI.indexOf(monthBranch);

  // 起运年龄：从出生日到最近节气的天数 / 3
  // 简化估算：顺排→距下个节气约(30-日)，逆排→距上个节气约(日)
  var baseStartAge;
  if (isForward) {
    baseStartAge = Math.max(1, Math.round((30 - birthDay) / 3));
  } else {
    baseStartAge = Math.max(1, Math.round(birthDay / 3));
  }
  if (baseStartAge > 10) baseStartAge = 10;

  var cycles = [];
  for (var i = 1; i <= 8; i++) {
    var sIdx = isForward ? (stemIdx + i) % 10 : (stemIdx - i + 100) % 10;
    var bIdx = isForward ? (branchIdx + i) % 12 : (branchIdx - i + 120) % 12;
    var stem = TIANGAN[sIdx];
    var branch = DIZHI[bIdx];
    var age = baseStartAge + (i - 1) * 10;
    cycles.push({
      index: i,
      stem: stem,
      branch: branch,
      ganZhi: stem + branch,
      startAge: age,
      endAge: age + 9,
      stemTenGod: getTenGod(dayStem, stem),
      branchTenGod: getTenGod(dayStem, ZHI_MAIN_GAN[branch] || branch)
    });
  }
  return { cycles: cycles, isForward: isForward, startAge: baseStartAge };
}

// ===== 组合关系检测 =====
function detectInteractions(yearBranch, monthBranch, dayBranch, hourBranch) {
  var branches = [yearBranch, monthBranch, dayBranch, hourBranch].filter(Boolean);
  var interactions = [];
  var seen = {};

  // 六冲
  var chong = { '子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳' };
  for (var i = 0; i < branches.length; i++) {
    for (var j = i+1; j < branches.length; j++) {
      if (chong[branches[i]] === branches[j]) {
        var key = '冲';
        if (!seen[key + branches[i] + branches[j]]) {
          seen[key + branches[i] + branches[j]] = true;
          interactions.push({ type: '冲', description: branches[i] + '冲' + branches[j] + ' — 冲则动，变则通' });
        }
      }
    }
  }

  // 三合局
  var sanhe = [['申','子','辰'],['寅','午','戌'],['巳','酉','丑'],['亥','卯','未']];
  sanhe.forEach(function(group) {
    var count = 0, present = [];
    group.forEach(function(g) {
      if (branches.indexOf(g) >= 0) { count++; present.push(g); }
    });
    if (count >= 2) {
      var key = '合' + present.join('');
      if (!seen[key]) {
        seen[key] = true;
        interactions.push({ type: '三合', description: present.join('+') + ' 三合化局' });
      }
    }
  });

  // 自刑（午午、酉酉、亥亥、辰辰、丑未、寅巳、申亥）
  branches.forEach(function(b, i) {
    branches.forEach(function(c, j) {
      if (i !== j && b === c) {
        var key = '刑' + b;
        if (!seen[key] && (b === '午' || b === '酉' || b === '亥' || b === '辰')) {
          seen[key] = true;
          interactions.push({ type: '自刑', description: b + b + ' 自刑 — 需慎行内省' });
        }
      }
    });
  });

  // 六合
  var liuhe = { '子':'丑','丑':'子','寅':'亥','亥':'寅','卯':'戌','戌':'卯','辰':'酉','酉':'辰','巳':'申','申':'巳','午':'未','未':'午' };
  for (var a = 0; a < branches.length; a++) {
    for (var b2 = a+1; b2 < branches.length; b2++) {
      if (liuhe[branches[a]] === branches[b2]) {
        var k2 = '合' + branches[a] + branches[b2];
        if (!seen[k2]) {
          seen[k2] = true;
          interactions.push({ type: '六合', description: branches[a] + '合' + branches[b2] + ' — 贵人相助' });
        }
      }
    }
  }

  return interactions;
}

// ===== 五行计数 =====
function countElements(pillars) {
  var counts = { wood: 0, fire: 0, earth: 0, metal: 0, water: 0 };
  var wuxingMap = { '木':'wood','火':'fire','土':'earth','金':'metal','水':'water' };

  function add(ganZhi) {
    var g = ganZhi[0], z = ganZhi[1];
    if (wuxingMap[GAN_WUXING[TIANGAN.indexOf(g)]]) counts[wuxingMap[GAN_WUXING[TIANGAN.indexOf(g)]]]++;
    if (ZHI_WUXING[z] && wuxingMap[ZHI_WUXING[z]]) counts[wuxingMap[ZHI_WUXING[z]]]++;
  }

  Object.values(pillars).forEach(function(p) {
    if (p && p.ganZhi) add(p.ganZhi);
  });

  return counts;
}

// ===== 主计算函数 =====
function calculateBazi(year, month, day, hour, minute, gender, longitude) {
  var hour2 = hour !== undefined && hour !== null ? hour : 12;
  var min = minute !== undefined && minute !== null ? minute : 0;

  // 1. 年柱
  var yearStem = getYearStem(year);
  var yearBranch = getYearBranch(year);

  // 2. 月柱（使用公历月，未严格按节气）
  var monthStem = getMonthStem(year, month, day);
  var monthBranch = getMonthBranch(month);

  // 3. 日柱
  var dayResult = getDayStemAndBranch(year, month, day);
  var dayStem = dayResult.stem;
  var dayBranch = dayResult.branch;

  // 4. 时柱
  var hourBranch2 = getHourStemAndBranch(hour2).branch;
  var hourStem = getHourStem(dayStem, hour2);

  // 组装四柱
  var pillars = {
    year: {
      stem: yearStem, branch: yearBranch,
      ganZhi: yearStem + yearBranch,
      stemTenGod: getTenGod(dayStem, yearStem),
      branchElement: ZHI_WUXING[yearBranch],
      naYin: NAYIN[yearStem + yearBranch] || '',
      hiddenStems: getHiddenStems(yearBranch),
      growthStage: getGrowthStage(yearStem, yearBranch)
    },
    month: {
      stem: monthStem, branch: monthBranch,
      ganZhi: monthStem + monthBranch,
      stemTenGod: getTenGod(dayStem, monthStem),
      branchElement: ZHI_WUXING[monthBranch],
      naYin: NAYIN[monthStem + monthBranch] || '',
      hiddenStems: getHiddenStems(monthBranch),
      growthStage: getGrowthStage(monthStem, monthBranch)
    },
    day: {
      stem: dayStem, branch: dayBranch,
      ganZhi: dayStem + dayBranch,
      stemTenGod: getTenGod(dayStem, dayStem) || '日主',
      branchElement: ZHI_WUXING[dayBranch],
      naYin: NAYIN[dayStem + dayBranch] || '',
      hiddenStems: getHiddenStems(dayBranch),
      growthStage: getGrowthStage(dayStem, dayBranch)
    },
    hour: {
      stem: hourStem, branch: hourBranch2,
      ganZhi: hourStem + hourBranch2,
      stemTenGod: getTenGod(dayStem, hourStem),
      branchElement: ZHI_WUXING[hourBranch2],
      naYin: NAYIN[hourStem + hourBranch2] || '',
      hiddenStems: getHiddenStems(hourBranch2),
      growthStage: getGrowthStage(hourStem, hourBranch2)
    }
  };

  // 日主
  var dayMaster = {
    char: dayStem,
    polarity: GAN_YINYANG[TIANGAN.indexOf(dayStem)],
    element: GAN_WUXING[TIANGAN.indexOf(dayStem)],
    pinyin: dayStem.toLowerCase()
  };

  // 农历
  var lunar = solarToLunar(year, month, day);
  var zodiac = ZHI_ZODIAC[yearBranch] || '';

  // 真太阳时（简化估算）
  var tstHour = hour2;
  if (longitude) {
    var standardLon = 120; // 东八区标准经度
    var diff = (longitude - standardLon) * 4; // 每度4分钟
    tstHour = hour2 + diff / 60;
  }

  // 大运方向：阳年男/阴年女顺排，阴年男/阳年女逆排
  var yearStemIdx = TIANGAN.indexOf(yearStem);
  var isDaYunForward;
  if (gender === 'male') {
    isDaYunForward = yearStemIdx % 2 === 0; // 阳年男顺排
  } else {
    isDaYunForward = yearStemIdx % 2 === 1; // 阴年女顺排
  }

  var daYun = calculateDaYun(monthStem, monthBranch, dayStem, day, isDaYunForward);

  // 组合关系
  var interactions = detectInteractions(yearBranch, monthBranch, dayBranch, hourBranch2);

  return {
    pillars: pillars,
    dayMaster: dayMaster,
    lunar: lunar,
    zodiac: zodiac,
    trueSolarHour: Math.floor(tstHour) + ':' + String(Math.round((tstHour % 1) * 60)).padStart(2,'0'),
    gender: gender,
    daYun: daYun,
    interactions: interactions,
    elementCounts: countElements(pillars)
  };
}

function isDayMasterStrong(data){
  var dm = data.dayMaster;
  var ec = data.elementCounts;
  var dmEl = dm.element;
  var dmCount = (ec[toEnKey(dmEl)] || 0);
  // Also count generating element
  var genEl = getGeneratingElement(dmEl);
  var genCount = (ec[toEnKey(genEl)] || 0);
  return (dmCount + genCount) >= 3;
}

function toEnKey(cnEl){
  var map = { '木':'wood', '火':'fire', '土':'earth', '金':'metal', '水':'water' };
  return map[cnEl] || cnEl;
}

function getMaxElement(ec){
  var max = 'wood', maxVal = 0;
  Object.keys(ec).forEach(function(k){
    if(ec[k] > maxVal){ maxVal = ec[k]; max = k; }
  });
  return max;
}

function getMinElement(ec){
  var min = 'wood', minVal = 999;
  Object.keys(ec).forEach(function(k){
    if(ec[k] < minVal){ minVal = ec[k]; min = k; }
  });
  return min;
}

function getControllingElement(el){
  var map = { '木':'金', '火':'水', '土':'木', '金':'火', '水':'土' };
  return map[el] || el;
}

function getGeneratingElement(el){
  var map = { '木':'水', '火':'木', '土':'火', '金':'土', '水':'金' };
  return map[el] || el;
}

// ===== 分享组件初始化 =====
function initBaziShare(data, name, year, month, day, hour, minute) {
  if (typeof ShareWidget === 'undefined') return;
  var p = data.pillars;
  var dm = data.dayMaster;
  var ec = data.elementCounts;

  var birthStr = year + '年' + month + '月' + day + '日 ' +
    String(hour).padStart(2, '0') + ':' + String(minute || 0).padStart(2, '0');

  var summary = '生辰：' + birthStr + '（' + (data.gender === 'male' ? '男' : '女') + '）\n';
  summary += '四柱：' + p.year.ganZhi + ' ' + p.month.ganZhi + ' ' + p.day.ganZhi + ' ' + p.hour.ganZhi + '\n';
  summary += '日主：' + dm.char + '（' + dm.polarity + dm.element + '）\n';
  summary += '生肖：' + data.zodiac + '\n';
  summary += '五行：木' + ec.wood + ' · 火' + ec.fire + ' · 土' + ec.earth + ' · 金' + ec.metal + ' · 水' + ec.water;

  ShareWidget.init({
    title: '八字排盘 · ' + dm.char + '日主',
    type: 'bazi',
    summary: summary,
    data: {
      name: name,
      birth: birthStr,
      gender: data.gender,
      pillars: { year: p.year.ganZhi, month: p.month.ganZhi, day: p.day.ganZhi, hour: p.hour.ganZhi },
      dayMaster: dm.char,
      dayMasterElement: dm.element,
      elementCounts: ec,
      zodiac: data.zodiac
    }
  });
}
